<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Book My Car - Add Car</title><style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f6ff;
}

header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    width:92%;
    max-width:550px;
    margin:25px auto;
}

.box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px #ccc;
}

h2{
    text-align:center;
    color:#007bff;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#007bff;
    color:white;
    border:0;
    border-radius:7px;
    font-size:18px;
    font-weight:bold;
}

.message{
    margin-top:15px;
    text-align:center;
    color:green;
    font-weight:bold;
}

</style></head><body><header><h1>🚗 Book My Car</h1><p>अपनी Car जोड़ें</p></header><div class="container"><div class="box"><h2>🚘 Car Owner Form</h2><label>Owner Name</label>

<input
id="ownerName"
type="text"
placeholder="Owner का नाम"

«»

<label>Owner Mobile</label>

<input
id="ownerPhone"
type="tel"
placeholder="10 अंकों का मोबाइल नंबर"
maxlength="10"

«»

<label>Car Model</label>

<select id="carModel"><option value="">
Car चुनें
</option><option>
Swift Dzire
</option><option>
Ertiga
</option><option>
Innova
</option><option>
Bolero
</option><option>
Scorpio
</option><option>
Other
</option></select><label>Car Number</label>

<input
id="carNumber"
type="text"
placeholder="CG13AB1234"

«»

<label>Driver Name</label>

<input
id="driverName"
type="text"
placeholder="Driver का नाम"

«»

<label>Driver Mobile</label>

<input
id="driverPhone"
type="tel"
placeholder="10 अंकों का मोबाइल नंबर"
maxlength="10"

«»

<label>Car उपलब्ध स्थान</label>

<input
id="location"
type="text"
placeholder="जैसे Sarangarh"

«»

<label>Per Day Rate ₹</label>

<input
id="dayRate"
type="number"
placeholder="2500"

«»

<label>Per KM Rate ₹</label>

<input
id="kmRate"
type="number"
placeholder="15"

«»

<label>Outstation Rate ₹</label>

<input
id="outstationRate"
type="number"
placeholder="3000"

«»

<button
type="button"
onclick="submitCar()"

«»

🚗 CAR SUBMIT करें

</button><div
id="message"
class="message"
></div></div></div><script>

function submitCar(){

    const owner =
    document.getElementById(
        "ownerName"
    ).value;

    const phone =
    document.getElementById(
        "ownerPhone"
    ).value;

    const car =
    document.getElementById(
        "carModel"
    ).value;

    if(owner==="" ||
       phone==="" ||
       car===""){

        alert(
            "कृपया Owner Name, Mobile और Car भरें।"
        );

        return;
    }


    document.getElementById(
        "message"
    ).innerHTML =

    "✅ Car की जानकारी submit हो गई!";


    alert(
        "✅ Car की जानकारी सफलतापूर्वक submit हो गई।"
    );

}

</script></body></html>
