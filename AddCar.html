<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - Owner Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6fb;color:#222}header{background:#075bd3;color:#fff;padding:20px;text-align:center}.container{max-width:760px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #0001}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:bold;margin:7px 0}input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:9px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#075bd3;color:#fff;font-size:16px;font-weight:bold;margin-top:8px}.secondary{background:#0b8f4d}.danger{background:#dc3545}.message{padding:12px;border-radius:8px;margin:10px 0;font-weight:bold}.success{background:#dff7e6;color:#16733a}.error{background:#ffe1e1;color:#a50000}.route,.car{border:1px solid #dce4ef;border-radius:11px;padding:12px;margin-top:10px;background:#fafcff}.small{font-size:13px;color:#667085}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🚗 Book My Car</h1><p>Car Owner Panel</p></header><div class="container"><div id="loginCard" class="card"><h2>📱 Owner Mobile OTP Login</h2><p class="small">केवल Admin-authorized Owner ही इस panel का उपयोग कर सकता है।</p><div id="loginMsg"></div><label>Owner Mobile Number</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210"><div id="recaptcha-container"></div><button id="sendOtp">📲 OTP भेजें</button><div id="otpBox" class="hidden"><label>OTP</label><input id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="6 digit OTP"><button id="verifyOtp" class="secondary">✅ OTP Verify करें</button></div></div><div id="panel" class="hidden"><div class="card"><button id="logout" class="danger">Logout</button><h2>➕ नई Car जोड़ें</h2><div id="message"></div><form id="carForm"><div class="grid"><div><label>Car Name</label><input id="carName" placeholder="Swift Dzire" required></div><div><label>Owner Name</label><input id="ownerName" required></div><div><label>Owner Mobile</label><input id="ownerMobile" type="tel" pattern="[0-9]{10}" maxlength="10" required></div><div><label>Driver Name</label><input id="driverName" required></div><div><label>Driver Mobile</label><input id="driverMobile" type="tel" pattern="[0-9]{10}" maxlength="10" required></div><div><label>Rent (₹)</label><input id="rent" type="number" min="0" required></div><div><label>Rate / KM (₹)</label><input id="ratePerKm" type="number" min="0" step="0.01" required></div><div><label>Commission (%)</label><input id="commission" type="number" min="0" max="100" step="0.01" required></div></div><h3>🛣️ Fixed Route / Route Adjust</h3><p class="small">जैसे Sarangarh → Raigarh ₹2200.</p><div class="grid"><div><label>From</label><input id="routeFrom"></div><div><label>To</label><input id="routeTo"></div><div><label>Fixed Fare (₹)</label><input id="routeFare" type="number"></div><div><button type="button" class="secondary" id="addRoute">➕ Route जोड़ें</button></div></div><div id="routes"></div><button id="saveBtn">🚗 Car Save करें</button></form></div><div class="card"><h2>🚘 मेरी Saved Cars</h2><div id="carsList">Loading...</div></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,setDoc,serverTimestamp,query,where}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const cfg={apiKey:'AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA',authDomain:'book-my-car-a97cf.firebaseapp.com',projectId:'book-my-car-a97cf',storageBucket:'book-my-car-a97cf.firebasestorage.app',messagingSenderId:'546652899903',appId:'1:546652899903:web:c280a58db101e01d1d468a'},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),routes=[],$=id=>document.getElementById(id);let confirmationResult=null,recaptcha=null,authorized=false;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function lmsg(t,c='error'){$('loginMsg').innerHTML='<div class="message '+c+'">'+esc(t)+'</div>'}function msg(t,c='success'){$('message').innerHTML='<div class="message '+c+'">'+esc(t)+'</div>'}function setupRecaptcha(){if(recaptcha)return;recaptcha=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal',callback:()=>{}});recaptcha.render().catch(e=>lmsg(e.message))}function phoneValue(){const p=$('phone').value.replace(/\D/g,'');return p.length===10?'+91'+p:null}async function checkOwner(u){const s=await getDoc(doc(db,'owners',u.uid));const o=s.exists()?s.data():null;authorized=!!(o&&o.role==='owner'&&o.active===true);if(!authorized){lmsg('❌ यह mobile Owner के रूप में authorized नहीं है। पहले Admin से authorization लें।');await signOut(auth);return false}return true}function renderRoutes(){$('routes').innerHTML=routes.map((r,i)=>`<div class="route"><b>${esc(r.from)} → ${esc(r.to)}</b> — ₹${Number(r.fare).toLocaleString('en-IN')}<button type="button" class="danger" onclick="removeRoute(${i})">🗑️ हटाएँ</button></div>`).join('')||'<p class="small">कोई fixed route नहीं।</p>'}window.removeRoute=i=>{routes.splice(i,1);renderRoutes()};$('sendOtp').onclick=async()=>{const phone=phoneValue();if(!phone)return lmsg('कृपया 10 digit mobile number डालें।');try{setupRecaptcha();confirmationResult=await signInWithPhoneNumber(auth,phone,recaptcha);$('otpBox').classList.remove('hidden');lmsg('OTP आपके mobile पर भेज दिया गया है।','success')}catch(e){lmsg('OTP नहीं भेजा जा सका: '+(e.code||e.message));if(recaptcha){try{recaptcha.clear()}catch(_){ }recaptcha=null}}};$('verifyOtp').onclick=async()=>{if(!confirmationResult)return lmsg('पहले OTP भेजें।');const code=$('otp').value.trim();if(!/^\d{6}$/.test(code))return lmsg('6 digit OTP डालें।');try{const result=await confirmationResult.confirm(code);const u=result.user;if(await checkOwner(u))lmsg('Owner login सफल।','success')}catch(e){lmsg('OTP गलत या expired है: '+(e.code||e.message))}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(u){if(await checkOwner(u)){$('loginCard').classList.add('hidden');$('panel').classList.remove('hidden');loadCars()}}else{$('loginCard').classList.remove('hidden');$('panel').classList.add('hidden');$('otpBox').classList.add('hidden');confirmationResult=null;authorized=false}});$('addRoute').onclick=()=>{const from=$('routeFrom').value.trim(),to=$('routeTo').value.trim(),fare=Number($('routeFare').value);if(!from||!to||fare<=0)return msg('From, To और Fare भरें।','error');routes.push({from,to,fare});$('routeFrom').value='';$('routeTo').value='';$('routeFare').value='';renderRoutes()};$('carForm').onsubmit=async e=>{e.preventDefault();try{const u=auth.currentUser;if(!u||!authorized)return lmsg('Owner authorization जरूरी है।');const s=await getDoc(doc(db,'owners',u.uid));if(!s.exists()||s.data().role!=='owner'||s.data().active!==true)return lmsg('Owner authorization inactive है।');const data={ownerUid:u.uid,carName:$('carName').value.trim(),ownerName:$('ownerName').value.trim(),ownerMobile:$('ownerMobile').value.trim(),driverName:$('driverName').value.trim(),driverMobile:$('driverMobile').value.trim(),rent:Number($('rent').value),ratePerKm:Number($('ratePerKm').value),commission:Number($('commission').value),fixedRoutes:routes,status:'available',createdAt:serverTimestamp()};const ref=await addDoc(collection(db,'cars'),data);await setDoc(doc(db,'publicCars',ref.id),{ownerUid:u.uid,carName:data.carName,ratePerKm:data.ratePerKm,fixedRoutes:data.fixedRoutes,status:'available'});msg('✅ Car save हो गई और customer के लिए Available कर दी गई।');$('carForm').reset();routes.length=0;renderRoutes();loadCars()}catch(e){msg('❌ '+e.message,'error')}};async function loadCars(){if(!authorized)return;try{const s=await getDocs(query(collection(db,'cars'),where('ownerUid','==',auth.currentUser.uid)));const items=[];for(const d of s.docs){const c=d.data();await setDoc(doc(db,'publicCars',d.id),{ownerUid:c.ownerUid,carName:c.carName,ratePerKm:c.ratePerKm,fixedRoutes:c.fixedRoutes||[],status:c.status||'available'});items.push(`<div class="car"><b>🚗 ${esc(c.carName)}</b><p>Owner: ${esc(c.ownerName)} 📱 ${esc(c.ownerMobile)}</p><p>Driver: ${esc(c.driverName)} 📱 ${esc(c.driverMobile)}</p><p>Rate/KM: ₹${Number(c.ratePerKm||0)}</p><p>${(c.fixedRoutes||[]).map(r=>`${esc(r.from)} → ${esc(r.to)} = ₹${Number(r.fare).toLocaleString('en-IN')}`).join('<br>')||'No fixed route'}</p><button class="danger" onclick="delCar('${d.id}')">🗑️ Delete</button></div>`)}$('carsList').innerHTML=items.join('')||'<p>आपकी कोई car नहीं है।</p>'}catch(e){$('carsList').textContent=e.message}}window.delCar=async id=>{if(!authorized)return;if(confirm('Car delete करें?')){await deleteDoc(doc(db,'cars',id));await deleteDoc(doc(db,'publicCars',id));loadCars()}};renderRoutes();</script></body></html>
