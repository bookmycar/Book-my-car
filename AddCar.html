<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Add Car</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#007bff,#0056d6);
    color:white;
    padding:18px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
    font-size:14px;
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:22px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.card h2{
    margin-top:0;
    color:#075bd3;
    font-size:21px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd3df;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#007bff;
    box-shadow:0 0 0 2px rgba(0,123,255,.1);
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#007bff;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#005dcc;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:13px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:bold;
}

.success{
    background:#dff7e6;
    color:#16733a;
}

.error{
    background:#ffe1e1;
    color:#a50000;
}

.car-item{
    border:1px solid #e0e5ed;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
    background:#fafcff;
}

.car-item h3{
    margin:0 0 10px;
    color:#075bd3;
}

.car-item p{
    margin:6px 0;
}

.delete-btn{
    margin-top:10px;
    background:#dc3545;
    font-size:14px;
    padding:10px;
}

.delete-btn:hover{
    background:#b02a37;
}

.loading{
    text-align:center;
    color:#666;
    padding:15px;
}

footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:20px;
}

@media(max-width:500px){
    .container{
        margin:15px auto;
    }

    .card{
        padding:17px;
    }

    header h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚗 Book My Car</h1>
    <p>Car Owner Panel - Add Your Car</p>
</header>

<div class="container">

    <div class="card">

        <h2>➕ नई Car जोड़ें</h2>

        <div id="message" class="message"></div>

        <form id="carForm">

            <div class="form-group">
                <label>Car Name</label>
                <input
                    type="text"
                    id="carName"
                    placeholder="जैसे: Swift Dzire"
                    required
                >
            </div>

            <div class="form-group">
                <label>Owner Name</label>
                <input
                    type="text"
                    id="ownerName"
                    placeholder="Car Owner का नाम"
                    required
                >
            </div>

            <div class="form-group">
                <label>Driver Name</label>
                <input
                    type="text"
                    id="driverName"
                    placeholder="Driver का नाम"
                    required
                >
            </div>

            <div class="form-group">
                <label>Rent (₹)</label>
                <input
                    type="number"
                    id="rent"
                    placeholder="जैसे: 2500"
                    min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label>Rate / KM (₹)</label>
                <input
                    type="number"
                    id="ratePerKm"
                    placeholder="जैसे: 12"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label>Commission (%)</label>
                <input
                    type="number"
                    id="commission"
                    placeholder="जैसे: 10"
                    min="0"
                    max="100"
                    step="0.01"
                    required
                >
            </div>

            <button type="submit" id="saveBtn">
                🚗 Car Save करें
            </button>

        </form>

    </div>


    <div class="card">

        <h2>🚘 Saved Cars</h2>

        <div id="carsList">
            <div class="loading">
                Cars loading...
            </div>
        </div>

    </div>

</div>

<footer>
    Created by Arvind Mehar
</footer>


<!-- Firebase -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

    authDomain:
    "book-my-car-a97cf.firebaseapp.com",

    projectId:
    "book-my-car-a97cf",

    storageBucket:
    "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId:
    "546652899903",

    appId:
    "1:546652899903:web:c280a58db101e01d1d468a"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   HTML ELEMENTS
========================= */

const carForm =
document.getElementById("carForm");

const saveBtn =
document.getElementById("saveBtn");

const message =
document.getElementById("message");

const carsList =
document.getElementById("carsList");


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
    "message " + type;

    message.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   SAVE CAR
========================= */

carForm.addEventListener("submit", async function(e){

    e.preventDefault();

    saveBtn.disabled = true;

    saveBtn.textContent =
    "⏳ Car Save हो रही है...";

    message.style.display = "none";


    try{

        const carName =
        document.getElementById("carName")
        .value
        .trim();

        const ownerName =
        document.getElementById("ownerName")
        .value
        .trim();

        const driverName =
        document.getElementById("driverName")
        .value
        .trim();

        const rent =
        Number(
            document.getElementById("rent").value
        );

        const ratePerKm =
        Number(
            document.getElementById("ratePerKm").value
        );

        const commission =
        Number(
            document.getElementById("commission").value
        );


        if(!carName ||
           !ownerName ||
           !driverName){

            throw new Error(
                "कृपया सभी जानकारी भरें।"
            );
        }


        if(rent < 0 ||
           ratePerKm < 0 ||
           commission < 0 ||
           commission > 100){

            throw new Error(
                "Rent, Rate/KM और Commission की value सही डालें।"
            );
        }


        /* =========================
           FIRESTORE SAVE
        ========================= */

        const carData = {

            carName: carName,

            ownerName: ownerName,

            driverName: driverName,

            rent: rent,

            ratePerKm: ratePerKm,

            commission: commission,

            status: "available",

            createdAt: serverTimestamp()

        };


        const docRef =
        await addDoc(
            collection(db,"cars"),
            carData
        );


        console.log(
            "Car Saved:",
            docRef.id
        );


        showMessage(
            "✅ Car सफलतापूर्वक Firebase में Save हो गई!",
            "success"
        );


        carForm.reset();


        saveBtn.disabled = false;

        saveBtn.textContent =
        "🚗 Car Save करें";


        loadCars();


    }catch(error){

        console.error(
            "Car Save Error:",
            error
        );


        showMessage(
            "❌ Car Save नहीं हो पाई: " +
            error.message,
            "error"
        );


        saveBtn.disabled = false;

        saveBtn.textContent =
        "🚗 Car Save करें";

    }

});


/* =========================
   LOAD CARS
========================= */

async function loadCars(){

    carsList.innerHTML =
    `<div class="loading">
        ⏳ Cars loading...
     </div>`;


    try{

        const q =
        query(
            collection(db,"cars"),
            orderBy("createdAt","desc")
        );


        const snapshot =
        await getDocs(q);


        if(snapshot.empty){

            carsList.innerHTML =
            `<div class="loading">
                अभी कोई Car Save नहीं है।
             </div>`;

            return;
        }


        carsList.innerHTML = "";


        snapshot.forEach((documentSnapshot)=>{

            const car =
            documentSnapshot.data();

            const id =
            documentSnapshot.id;


            const item =
            document.createElement("div");

            item.className =
            "car-item";


            item.innerHTML = `

                <h3>
                    🚗 ${escapeHtml(car.carName || "")}
                </h3>

                <p>
                    <b>Owner:</b>
                    ${escapeHtml(car.ownerName || "")}
                </p>

                <p>
                    <b>Driver:</b>
                    ${escapeHtml(car.driverName || "")}
                </p>

                <p>
                    <b>Rent:</b>
                    ₹${Number(car.rent || 0)}
                </p>

                <p>
                    <b>Rate/KM:</b>
                    ₹${Number(car.ratePerKm || 0)}
                </p>

                <p>
                    <b>Commission:</b>
                    ${Number(car.commission || 0)}%
                </p>

                <p>
                    <b>Status:</b>
                    ${escapeHtml(car.status || "available")}
                </p>

                <button
                    class="delete-btn"
                    data-id="${id}">
                    🗑️ Delete Car
                </button>

            `;


            carsList.appendChild(item);

        });


        /* Delete buttons */

        document
        .querySelectorAll(".delete-btn")
        .forEach(button=>{

            button.addEventListener(
                "click",
                function(){

                    deleteCar(
                        this.dataset.id
                    );

                }
            );

        });


    }catch(error){

        console.error(
            "Load Cars Error:",
            error
        );


        carsList.innerHTML =
        `<div class="message error"
              style="display:block">

            ❌ Cars load नहीं हो पाईं।
            <br><br>
            Firebase Firestore Rules और
            connection check करें।

         </div>`;

    }

}


/* =========================
   DELETE CAR
========================= */

async function deleteCar(id){

    const confirmDelete =
    confirm(
        "क्या आप यह Car Delete करना चाहते हैं?"
    );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(
            doc(db,"cars",id)
        );


        showMessage(
            "✅ Car Delete हो गई।",
            "success"
        );


        loadCars();


    }catch(error){

        console.error(
            "Delete Error:",
            error
        );


        showMessage(
            "❌ Car Delete नहीं हो पाई: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadCars();

</script>

</body>
</html>
