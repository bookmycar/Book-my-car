<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - Owner Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#222}header{background:linear-gradient(135deg,#007bff,#0056d6);color:#fff;padding:20px;text-align:center}header h1{margin:0}.container{max-width:760px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #0001}.form-group{margin-bottom:14px}label{display:block;font-weight:bold;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:9px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:9px;background:#007bff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.secondary{background:#0b8f4d}.danger{background:#dc3545}.message{display:none;padding:12px;border-radius:8px;margin-bottom:14px;font-weight:bold}.success{background:#dff7e6;color:#16733a}.error{background:#ffe1e1;color:#a50000}.route{border:1px solid #dce4ef;border-radius:11px;padding:12px;margin-top:10px;background:#fafcff}.route button{margin-top:8px;font-size:14px;padding:9px}.car{border:1px solid #dce4ef;border-radius:12px;padding:15px;margin-top:12px}.small{font-size:13px;color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}} </style></head><body><header><h1>🚗 Book My Car</h1><p>Car Owner Panel</p></header><div class="container"><div class="card"><h2>➕ नई Car जोड़ें</h2><div id="message" class="message"></div><form id="carForm"><div class="grid"><div class="form-group"><label>Car Name</label><input id="carName" placeholder="Swift Dzire" required></div><div class="form-group"><label>Owner Name</label><input id="ownerName" placeholder="Owner का नाम" required></div><div class="form-group"><label>Owner Mobile Number</label><input id="ownerMobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile" required></div><div class="form-group"><label>Driver Name</label><input id="driverName" placeholder="Driver का नाम" required></div><div class="form-group"><label>Driver Mobile Number</label><input id="driverMobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile" required></div><div class="form-group"><label>Rent (₹)</label><input id="rent" type="number" min="0" placeholder="2500" required></div><div class="form-group"><label>Rate / KM (₹)</label><input id="ratePerKm" type="number" min="0" step="0.01" placeholder="12" required></div><div class="form-group"><label>Commission (%)</label><input id="commission" type="number" min="0" max="100" step="0.01" placeholder="10" required></div></div><h3>🛣️ Fixed Route / Route Adjust</h3><p class="small">जैसे Sarangarh → Raigarh ₹2200. जितने route चाहिए, एक-एक करके जोड़ें।</p><div class="grid"><div><label>From</label><input id="routeFrom" placeholder="Sarangarh"></div><div><label>To</label><input id="routeTo" placeholder="Raigarh"></div><div><label>Fixed Fare (₹)</label><input id="routeFare" type="number" min="0" placeholder="2200"></div><div style="display:flex;align-items:end"><button type="button" class="secondary" id="addRoute">➕ Route जोड़ें</button></div></div><div id="routes"></div><br><button id="saveBtn" type="submit">🚗 Car Save करें</button></form></div><div class="card"><h2>🚘 Saved Cars</h2><div id="carsList">Loading...</div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp,query,orderBy}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const cfg={apiKey:'AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA',authDomain:'book-my-car-a97cf.firebaseapp.com',projectId:'book-my-car-a97cf',storageBucket:'book-my-car-a97cf.firebasestorage.app',messagingSenderId:'546652899903',appId:'1:546652899903:web:c280a58db101e01d1d468a'},db=getFirestore(initializeApp(cfg)),routes=[],$=id=>document.getElementById(id);function msg(t,c){$('message').textContent=t;$('message').className='message '+c;$('message').style.display='block'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function renderRoutes(){ $('routes').innerHTML=routes.length?routes.map((r,i)=>`<div class="route"><b>🛣️ ${esc(r.from)} → ${esc(r.to)}</b><br>Fixed Fare: <b>₹${Number(r.fare).toLocaleString('en-IN')}</b><button type="button" class="danger" onclick="removeRoute(${i})">🗑️ Route हटाएँ</button></div>`).join(''):'<p class="small">अभी कोई fixed route नहीं जोड़ा गया।</p>'}window.removeRoute=i=>{routes.splice(i,1);renderRoutes()};$('addRoute').onclick=()=>{const from=$('routeFrom').value.trim(),to=$('routeTo').value.trim(),fare=Number($('routeFare').value);if(!from||!to||fare<=0)return msg('From, To और सही Fare भरें।','error');routes.push({from,to,fare});$('routeFrom').value='';$('routeTo').value='';$('routeFare').value='';renderRoutes();msg('✅ Route जोड़ दिया गया।','success')};$('carForm').onsubmit=async e=>{e.preventDefault();const ownerMobile=$('ownerMobile').value.trim(),driverMobile=$('driverMobile').value.trim();if(!/^[0-9]{10}$/.test(ownerMobile)||!/^[0-9]{10}$/.test(driverMobile))return msg('Owner और Driver का 10 digit mobile number डालें।','error');try{$('saveBtn').disabled=true;await addDoc(collection(db,'cars'),{carName:$('carName').value.trim(),ownerName:$('ownerName').value.trim(),ownerMobile,driverName:$('driverName').value.trim(),driverMobile,rent:Number($('rent').value),ratePerKm:Number($('ratePerKm').value),commission:Number($('commission').value),fixedRoutes:routes,status:'available',createdAt:serverTimestamp()});msg('✅ Car, mobile numbers और routes Firebase में save हो गए।','success');$('carForm').reset();routes.length=0;renderRoutes();loadCars()}catch(e){msg('❌ Save नहीं हुआ: '+e.message,'error')}finally{$('saveBtn').disabled=false}};async function loadCars(){try{const s=await getDocs(query(collection(db,'cars'),orderBy('createdAt','desc')));if(s.empty){$('carsList').innerHTML='अभी कोई Car नहीं है।';return}$('carsList').innerHTML=s.docs.map(d=>{const c=d.data(),rs=c.fixedRoutes||[];return `<div class="car"><h3>🚗 ${esc(c.carName)}</h3><p><b>Owner:</b> ${esc(c.ownerName)} — 📱 ${esc(c.ownerMobile||'')}</p><p><b>Driver:</b> ${esc(c.driverName)} — 📱 ${esc(c.driverMobile||'')}</p><p><b>Rent:</b> ₹${Number(c.rent||0)} | <b>Rate/KM:</b> ₹${Number(c.ratePerKm||0)}</p><p><b>Fixed Routes:</b> ${rs.length?rs.map(r=>`${esc(r.from)} → ${esc(r.to)} = ₹${Number(r.fare).toLocaleString('en-IN')}`).join('<br>'):'None'}</p><button class="danger" onclick="delCar('${d.id}')">🗑️ Delete Car</button></div>`}).join('')}catch(e){$('carsList').innerHTML='❌ Cars load नहीं हो पाईं: '+esc(e.message)}}window.delCar=async id=>{if(!confirm('क्या यह Car Delete करना चाहते हैं?'))return;try{await deleteDoc(doc(db,'cars',id));msg('✅ Car delete हो गई।','success');loadCars()}catch(e){msg('❌ Delete नहीं हुआ: '+e.message,'error')}};renderRoutes();loadCars();</script></body></html>
