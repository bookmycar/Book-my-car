<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - My Booking</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#071b4d,#0b63f6);color:#fff;padding:20px;text-align:center}.wrap{max-width:760px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px #10204d12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}input{width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:10px}button{padding:13px 18px;border:0;border-radius:10px;background:#0b63f6;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.msg{padding:12px;border-radius:10px;margin:10px 0}.err{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.hidden{display:none!important}.receipt{border:2px dashed #d5ddea;padding:20px;border-radius:15px}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #e8edf3}.total{font-size:25px;color:#079455}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{.noPrint{display:none!important}body{background:#fff}.card{box-shadow:none}}</style></head><body><header class="top"><h1>🚗 Book My Car</h1><p>Booking Receipt / My Booking</p></header><main class="wrap"><section class="card noPrint"><h2>🔎 Booking खोजें</h2><div class="grid"><div><label>Booking ID</label><input id="bid" placeholder="Booking ID"></div><div><label>Mobile Number</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Booking वाला mobile"></div><div class="full"><button id="find">🔍 Booking देखें</button></div></div><div id="msg"></div></section><section id="receipt" class="card hidden"><div class="receipt"><h2>🧾 BOOKING RECEIPT</h2><div id="details"></div></div><button class="noPrint" onclick="window.print()">🖨️ Print / Save PDF</button><button class="noPrint" onclick="location.href='index.html'">🚗 नई Booking</button></section></main><script>const FUNCTION='https://asia-south1-book-my-car-a97cf.cloudfunctions.net/getBooking',$=x=>document.getElementById(x),money=v=>'₹'+Math.round(Number(v)||0).toLocaleString('en-IN'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t,ok=false){$('msg').innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}function row(a,b){return '<div class="row"><span>'+esc(a)+'</span><strong>'+esc(b)+'</strong></div>'}async function show(){const id=$('bid').value.trim(),m=$('mobile').value.trim();if(!id||!/^[0-9]{10}$/.test(m))return msg('Booking ID और सही 10 digit mobile डालें।');const btn=$('find');btn.disabled=true;try{const r=await fetch(FUNCTION,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId:id,mobile:m})});const d=await r.json();if(!r.ok)throw Error(d.error||'Booking नहीं मिली');const b=d.booking;$('details').innerHTML=row('Booking ID',d.bookingId)+row('Customer',b.customerName)+row('Mobile',b.mobile)+row('Route',(b.pickup||'-')+' → '+(b.destination||'-'))+row('Car',b.carName||'-')+row('Date / Time',(b.date||'-')+' '+(b.pickupTime||''))+row('Trip',b.tripType||'-')+row('Distance',(b.distanceKm||0)+' KM')+row('Payment',((b.paymentMethod||'-')+' / '+(b.paymentStatus||'Pending')))+row('Status',b.status||'Pending')+row('Total Fare',money(b.totalFare));$('receipt').classList.remove('hidden');msg('Booking मिल गई। Receipt नीचे है।',true)}catch(e){msg('❌ '+e.message)}finally{btn.disabled=false}}$('find').onclick=show;const p=new URLSearchParams(location.search),pid=p.get('bookingId');if(pid){$('bid').value=pid;msg('Booking ID मिल गई है। Mobile number डालकर देखें।',true)}</script></body></html>
