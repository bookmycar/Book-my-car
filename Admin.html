<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - Admin</title><style>body{font-family:Arial;margin:0;background:#f3f6fb;color:#172033}header{background:#075bd3;color:#fff;padding:16px;display:flex;justify-content:space-between}main{max-width:1200px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 15px #0001}input,button,select{padding:12px;border-radius:8px;border:1px solid #ccd5e3;font:inherit}input,select{width:100%;margin:6px 0 12px}button{background:#075bd3;color:#fff;border:0;font-weight:bold;cursor:pointer}.danger{background:#dc2626}.ok{background:#16a34a}.login{max-width:420px;margin:80px auto}.hidden{display:none!important}.msg{padding:12px;border-radius:8px;margin:10px 0}.err{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#fff;border-radius:12px}.stat b{font-size:26px;color:#075bd3}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.table{overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="box login"><h2>🚗 Book My Car Admin</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button id="loginBtn">🔐 Login</button></form><div id="loginMsg"></div></div><div id="app" class="hidden"><header><b>🚗 Book My Car - Admin Panel</b><button id="logout">Logout</button></header><main><div id="msg"></div><div class="grid"><div class="stat">Bookings<br><b id="total">0</b></div><div class="stat">Pending<br><b id="pending">0</b></div><div class="stat">Confirmed<br><b id="confirmed">0</b></div><div class="stat">Cars<br><b id="cars">0</b></div></div><div class="box"><h2>📋 Bookings</h2><button id="refreshBookings">🔄 Refresh</button><div class="table"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Car</th><th>Route</th><th>Date</th><th>Fare</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingBody"></tbody></table></div></div><div class="box"><h2>🚘 Cars</h2><button id="refreshCars">🔄 Refresh</button><div class="table"><table><thead><tr><th>Car</th><th>Owner</th><th>Driver</th><th>Rent</th><th>Rate/KM</th><th>Status</th><th>Action</th></tr></thead><tbody id="carBody"></tbody></table></div></div></main></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,getDocs,doc,updateDoc,deleteDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const cfg={apiKey:'AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA',authDomain:'book-my-car-a97cf.firebaseapp.com',projectId:'book-my-car-a97cf',storageBucket:'book-my-car-a97cf.firebasestorage.app',messagingSenderId:'546652899903',appId:'1:546652899903:web:c280a58db101e01d1d468a'},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let bookings=[],cars=[];const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>'₹'+(Number(v)||0).toLocaleString('en-IN');function showMsg(t,good=false){$('msg').innerHTML='<div class="msg '+(good?'good':'err')+'">'+safe(t)+'</div>'}async function load(){await Promise.all([loadBookings(),loadCars()]);$('total').textContent=bookings.length;$('pending').textContent=bookings.filter(x=>String(x.status).toLowerCase()==='pending').length;$('confirmed').textContent=bookings.filter(x=>String(x.status).toLowerCase()==='confirmed').length;$('cars').textContent=cars.length}async function loadBookings(){try{const s=await getDocs(collection(db,'bookings'));bookings=s.docs.map(d=>({id:d.id,...d.data()}));$('bookingBody').innerHTML=bookings.length?bookings.map(b=>{const st=String(b.status||'Pending');return '<tr><td>'+safe(b.customerName||'-')+'</td><td>'+safe(b.mobile||'-')+'</td><td>'+safe(b.carName||'-')+'</td><td>'+safe((b.pickup||'-')+' → '+(b.destination||'-'))+'</td><td>'+safe(b.date||b.bookingDate||'-')+'</td><td>'+money(b.totalFare??b.fare??b.calculatedFare)+'</td><td>'+safe(st)+'</td><td>'+(st.toLowerCase()!=='confirmed'?'<button class="ok" data-a="confirm" data-id="'+b.id+'">Confirm</button> ':'')+(st.toLowerCase()!=='cancelled'?'<button class="danger" data-a="cancel" data-id="'+b.id+'">Cancel</button> ':'')+'<button class="danger" data-a="delete" data-id="'+b.id+'">Delete</button></td></tr>'}).join(''):'<tr><td colspan="8">कोई booking नहीं मिली।</td></tr>'}catch(e){showMsg('Bookings load error: '+e.message)}}async function loadCars(){try{const s=await getDocs(collection(db,'cars'));cars=s.docs.map(d=>({id:d.id,...d.data()}));$('carBody').innerHTML=cars.length?cars.map(c=>'<tr><td>'+safe(c.carName||'-')+'</td><td>'+safe(c.ownerName||c.owner||'-')+'</td><td>'+safe(c.driverName||c.driver||'-')+'</td><td>'+money(c.rent)+'</td><td>'+money(c.ratePerKm??c.rate??c.localRate)+'</td><td>'+safe(c.status||'available')+'</td><td><button data-a="toggle" data-id="'+c.id+'">Toggle</button> <button class="danger" data-a="deleteCar" data-id="'+c.id+'">Delete</button></td></tr>').join(''):'<tr><td colspan="7">कोई car नहीं मिली।</td></tr>'}catch(e){showMsg('Cars load error: '+e.message)}}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(e){$('loginMsg').innerHTML='<div class="msg err">Login failed: '+safe(e.message)+'</div>'}finally{$('loginBtn').disabled=false}});onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});$('logout').onclick=()=>signOut(auth);$('refreshBookings').onclick=loadBookings;$('refreshCars').onclick=loadCars;$('bookingBody').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.a==='delete'){if(!confirm('Booking delete करें?'))return;await deleteDoc(doc(db,'bookings',b.dataset.id))}else await updateDoc(doc(db,'bookings',b.dataset.id),{status:b.dataset.a==='confirm'?'Confirmed':'Cancelled',updatedAt:new Date().toISOString()});await load()}catch(x){showMsg(x.message)}};$('carBody').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.a==='deleteCar'){if(!confirm('Car delete करें?'))return;await deleteDoc(doc(db,'cars',b.dataset.id))}else{const c=cars.find(x=>x.id===b.dataset.id);await updateDoc(doc(db,'cars',b.dataset.id),{status:String(c?.status||'available').toLowerCase()==='available'?'unavailable':'available'})}await load()}catch(x){showMsg(x.message)}};</script></body></html>
