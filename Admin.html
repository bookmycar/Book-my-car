<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#007bff,#0056d6);
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:20px auto;
}

.login-box,
.dashboard{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.login-box{
    max-width:450px;
    margin:30px auto;
}

h2{
    color:#007bff;
    text-align:center;
}

input{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    width:100%;
    margin-top:15px;
    background:#007bff;
    font-size:17px;
}

.logout-btn{
    background:#dc3545;
    float:right;
}

.refresh-btn{
    background:#198754;
    margin:5px 5px 15px 0;
}

.car-refresh{
    background:#0d6efd;
}

.booking-card,
.car-card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:16px;
    margin-top:15px;
    background:#fafafa;
}

.booking-card h3,
.car-card h3{
    margin-top:0;
    color:#007bff;
}

.car-card{
    border-left:5px solid #198754;
}

.car-card h3{
    color:#198754;
}

.info{
    margin:7px 0;
    line-height:1.5;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-weight:bold;
    font-size:13px;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.confirmed{
    background:#d1e7dd;
    color:#0f5132;
}

.cancelled{
    background:#f8d7da;
    color:#842029;
}

.action-buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
}

.confirm-btn{
    background:#198754;
}

.cancel-btn{
    background:#dc3545;
}

.delete-btn{
    background:#6c757d;
}

.section{
    margin-top:30px;
    padding-top:10px;
    border-top:2px solid #eee;
}

.section-title{
    background:#eef5ff;
    padding:12px;
    border-radius:8px;
    color:#0056d6;
    font-size:21px;
    font-weight:bold;
}

.car-title{
    background:#eaf8ef;
    color:#198754;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

.loading{
    text-align:center;
    padding:20px;
    color:#007bff;
}

#error{
    color:#dc3545;
    text-align:center;
    margin-top:10px;
}

.success{
    color:#198754;
}

.danger{
    color:#dc3545;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .container{
        width:94%;
    }

    .booking-card,
    .car-card{
        font-size:15px;
    }

    button{
        padding:9px 11px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚗 Book My Car - Admin Panel</h1>
</header>

<div class="container">

<!-- LOGIN -->

<div class="login-box" id="loginBox">

    <h2>🔐 Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="login-btn"
        onclick="adminLogin()"
    >
        Login
    </button>

    <div id="error"></div>

</div>


<!-- DASHBOARD -->

<div
    class="dashboard"
    id="dashboard"
    style="display:none;"
>

<button
    class="logout-btn"
    onclick="adminLogout()"
>
    Logout
</button>


<h2>📊 Admin Dashboard</h2>


<!-- BOOKINGS -->

<div class="section">

    <div class="section-title">
        📋 Booking Dashboard
    </div>

    <br>

    <button
        class="refresh-btn"
        onclick="loadBookings()"
    >
        🔄 Refresh Bookings
    </button>

    <div id="bookingList">
        Loading...
    </div>

</div>


<!-- CARS -->

<div class="section">

    <div class="section-title car-title">
        🚗 Added Cars
    </div>

    <br>

    <button
        class="refresh-btn car-refresh"
        onclick="loadCars()"
    >
        🔄 Refresh Cars
    </button>

    <div id="carList">
        Cars loading...
    </div>

</div>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    orderBy,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

    authDomain:
    "book-my-car-a97cf.firebaseapp.com",

    projectId:
    "book-my-car-a97cf",

    storageBucket:
    "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId:
    "546652899903",

    appId:
    "1:546652899903:web:c280a58db101e01d1d468a"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   LOGIN
========================= */

window.adminLogin = async function(){

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("error");

    error.innerText = "";

    if(email === "" || password === ""){

        error.innerText =
        "Email और Password भरें।";

        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(e){

        console.error(e);

        error.innerText =
        "Login failed: Email या Password गलत है।";
    }
};


/* =========================
   LOGOUT
========================= */

window.adminLogout = async function(){

    await signOut(auth);

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            document.getElementById(
                "loginBox"
            ).style.display = "none";

            document.getElementById(
                "dashboard"
            ).style.display = "block";

            loadBookings();

            loadCars();

        }
        else{

            document.getElementById(
                "loginBox"
            ).style.display = "block";

            document.getElementById(
                "dashboard"
            ).style.display = "none";

        }

    }
);


/* =========================
   LOAD BOOKINGS
========================= */

window.loadBookings = async function(){

    const list =
        document.getElementById(
            "bookingList"
        );

    list.innerHTML =
        '<div class="loading">⏳ Bookings loading...</div>';

    try{

        const q =
            query(
                collection(db,"bookings"),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );

        const snapshot =
            await getDocs(q);

        if(snapshot.empty){

            list.innerHTML =
            '<div class="empty">अभी कोई booking नहीं है।</div>';

            return;
        }

        list.innerHTML = "";

        snapshot.forEach(
            bookingDoc => {

                const data =
                    bookingDoc.data();

                const id =
                    bookingDoc.id;

                const status =
                    data.status || "Pending";

                let statusClass =
                    "pending";

                if(status === "Confirmed"){
                    statusClass =
                    "confirmed";
                }

                if(status === "Cancelled"){
                    statusClass =
                    "cancelled";
                }

                const card =
                    document.createElement("div");

                card.className =
                    "booking-card";

                card.innerHTML = `

                    <h3>
                        🚗 ${escapeHTML(
                            data.car || "Car"
                        )}
                    </h3>

                    <div class="info">
                        <b>Booking ID:</b>
                        ${escapeHTML(id)}
                    </div>

                    <div class="info">
                        👤 <b>Customer:</b>
                        ${escapeHTML(
                            data.customer || "-"
                        )}
                    </div>

                    <div class="info">
                        📞 <b>Mobile:</b>
                        ${escapeHTML(
                            data.phone || "-"
                        )}
                    </div>

                    <div class="info">
                        📍 <b>From:</b>
                        ${escapeHTML(
                            data.pickup || "-"
                        )}
                    </div>

                    <div class="info">
                        🏁 <b>To:</b>
                        ${escapeHTML(
                            data.drop || "-"
                        )}
                    </div>

                    <div class="info">
                        📅 <b>Date:</b>
                        ${escapeHTML(
                            data.date || "-"
                        )}
                    </div>

                    <div class="info">
                        ⏰ <b>Time:</b>
                        ${escapeHTML(
                            data.time || "-"
                        )}
                    </div>

                    <div class="info">
                        💰 <b>Advance:</b>
                        ₹${Number(
                            data.advance || 0
                        )}
                    </div>

                    <div class="info">
                        👨‍✈️ <b>Driver:</b>
                        ${escapeHTML(
                            data.driver || "Pending"
                        )}
                    </div>

                    <div class="info">
                        🚘 <b>Owner:</b>
                        ${escapeHTML(
                            data.owner || "Pending"
                        )}
                    </div>

                    <div class="info">
                        <b>Status:</b>

                        <span class="status ${statusClass}">
                            ${escapeHTML(status)}
                        </span>
                    </div>

                    <div class="action-buttons">

                        <button
                            class="confirm-btn"
                            onclick="updateStatus(
                                '${id}',
                                'Confirmed'
                            )"
                        >
                            ✅ Confirm
                        </button>

                        <button
                            class="cancel-btn"
                            onclick="updateStatus(
                                '${id}',
                                'Cancelled'
                            )"
                        >
                            ❌ Cancel
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteBooking(
                                '${id}'
                            )"
                        >
                            🗑 Delete
                        </button>

                    </div>
                `;

                list.appendChild(card);

            }
        );

    }
    catch(error){

        console.error(error);

        list.innerHTML =
        `<div class="empty">
            ❌ Booking load नहीं हुई।<br><br>
            Firestore Rules या createdAt field check करें।
        </div>`;

    }
};


/* =========================
   LOAD CARS
========================= */

window.loadCars = async function(){

    const list =
        document.getElementById(
            "carList"
        );

    list.innerHTML =
        '<div class="loading">⏳ Cars loading...</div>';

    try{

        /*
         * IMPORTANT:
         * यह cars collection पढ़ेगा
         */

        const q =
            query(
                collection(db,"cars"),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );

        const snapshot =
            await getDocs(q);

        if(snapshot.empty){

            list.innerHTML =
            `<div class="empty">
                🚗 अभी कोई car add नहीं हुई है।
                <br><br>
                AddCar.html से car add करके
                यहाँ Refresh Cars दबाएँ।
            </div>`;

            return;
        }

        list.innerHTML = "";

        snapshot.forEach(
            carDoc => {

                const data =
                    carDoc.data();

                const id =
                    carDoc.id;


                /*
                 * अलग-अलग AddCar versions में
                 * field names अलग हो सकते हैं।
                 * इसलिए कई possible names check किए गए हैं।
                 */

                const carName =
                    data.carName ||
                    data.car ||
                    data.vehicleName ||
                    data.name ||
                    "Car";


                const owner =
                    data.ownerName ||
                    data.owner ||
                    data.owner_name ||
                    "-";


                const ownerPhone =
                    data.ownerPhone ||
                    data.phone ||
                    data.mobile ||
                    data.ownerMobile ||
                    "-";


                const driver =
                    data.driverName ||
                    data.driver ||
                    "-";


                const driverPhone =
                    data.driverPhone ||
                    data.driverMobile ||
                    "-";


                const carNumber =
                    data.carNumber ||
                    data.number ||
                    data.vehicleNumber ||
                    "Not Available";


                const carType =
                    data.carType ||
                    data.type ||
                    "-";


                const localRate =
                    data.localRate ||
                    data.local_rate ||
                    data.localPrice ||
                    data.localRent ||
                    "";


                const outstationRate =
                    data.outstationRate ||
                    data.outstation_rate ||
                    data.outstationPrice ||
                    data.outstationRent ||
                    "";


                const perKm =
                    data.perKm ||
                    data.ratePerKm ||
                    data.rateKm ||
                    data.kmRate ||
                    "";


                const commission =
                    data.commission ||
                    data.commissionPercent ||
                    data.commissionRate ||
                    "";


                const status =
                    data.status ||
                    "Available";


                const card =
                    document.createElement("div");

                card.className =
                    "car-card";


                card.innerHTML = `

                    <h3>
                        🚗 ${escapeHTML(carName)}
                    </h3>

                    <div class="info">
                        <b>Car ID:</b>
                        ${escapeHTML(id)}
                    </div>

                    <div class="info">
                        🚘 <b>Car Number:</b>
                        ${escapeHTML(carNumber)}
                    </div>

                    <div class="info">
                        🚙 <b>Car Type:</b>
                        ${escapeHTML(carType)}
                    </div>

                    <div class="info">
                        👤 <b>Owner:</b>
                        ${escapeHTML(owner)}
                    </div>

                    <div class="info">
                        📞 <b>Owner Mobile:</b>
                        ${escapeHTML(ownerPhone)}
                    </div>

                    <div class="info">
                        👨‍✈️ <b>Driver:</b>
                        ${escapeHTML(driver)}
                    </div>

                    <div class="info">
                        📞 <b>Driver Mobile:</b>
                        ${escapeHTML(driverPhone)}
                    </div>

                    <div class="info">
                        🏠 <b>Local Rate:</b>
                        ${localRate !== ""
                            ? "₹" + escapeHTML(localRate)
                            : "-"
                        }
                    </div>

                    <div class="info">
                        🛣️ <b>Outstation Rate:</b>
                        ${outstationRate !== ""
                            ? "₹" + escapeHTML(outstationRate)
                            : "-"
                        }
                    </div>

                    <div class="info">
                        📏 <b>Rate / KM:</b>
                        ${perKm !== ""
                            ? "₹" + escapeHTML(perKm)
                            : "-"
                        }
                    </div>

                    <div class="info">
                        💼 <b>Commission:</b>
                        ${commission !== ""
                            ? escapeHTML(commission) + "%"
                            : "-"
                        }
                    </div>

                    <div class="info">
                        📌 <b>Status:</b>
                        ${escapeHTML(status)}
                    </div>

                    <div class="action-buttons">

                        <button
                            class="delete-btn"
                            onclick="deleteCar('${id}')"
                        >
                            🗑 Delete Car
                        </button>

                    </div>

                `;

                list.appendChild(card);

            }
        );

    }
    catch(error){

        console.error(error);

        list.innerHTML =
        `<div class="empty">
            ❌ Cars load नहीं हुईं।<br><br>

            संभव कारण:<br>
            1. Firestore में "cars" collection नहीं है।<br>
            2. Firestore Rules read की अनुमति नहीं दे रहे हैं।<br>
            3. createdAt field मौजूद नहीं है।
        </div>`;

    }
};


/* =========================
   UPDATE BOOKING STATUS
========================= */

window.updateStatus =
async function(id,status){

    try{

        await updateDoc(

            doc(
                db,
                "bookings",
                id
            ),

            {
                status:status
            }

        );

        alert(
            "Booking status: " + status
        );

        loadBookings();

    }
    catch(error){

        console.error(error);

        alert(
            "Status update नहीं हुआ।"
        );

    }

};


/* =========================
   DELETE BOOKING
========================= */

window.deleteBooking =
async function(id){

    const ok =
        confirm(
