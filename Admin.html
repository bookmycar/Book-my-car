<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Book My Car - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0069d9,#003f9e);
    color:#fff;
    padding:18px 15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
    opacity:.9;
}

.container{
    width:96%;
    max-width:1250px;
    margin:18px auto;
}

.login-box,
.panel{
    background:#fff;
    border-radius:16px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.login-box{
    max-width:430px;
    margin:45px auto;
    padding:25px;
}

.login-box h2{
    text-align:center;
    color:#0069d9;
}

input,
select{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #d9dee7;
    border-radius:9px;
    font-size:15px;
    background:#fff;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 13px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.login-btn{
    width:100%;
    background:#0069d9;
    margin-top:10px;
    font-size:16px;
}

.logout{
    background:#dc3545;
    float:right;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.topbar h2{
    margin:0;
}

.cards{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}

.stat{
    background:#fff;
    padding:17px;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
    text-align:center;
}

.stat .icon{
    font-size:27px;
}

.stat .number{
    font-size:25px;
    font-weight:bold;
    margin-top:5px;
    color:#0069d9;
}

.stat small{
    color:#666;
}

.panel{
    padding:18px;
    margin-top:18px;
}

.panel-title{
    font-size:21px;
    font-weight:bold;
    color:#0056b3;
    margin-bottom:14px;
}

.toolbar{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:8px;
    margin-bottom:15px;
}

.refresh{
    background:#198754;
}

.blue{
    background:#0069d9;
