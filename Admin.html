<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#003caa,#007bff);
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:0 12px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.login{
    max-width:420px;
    margin:40px auto;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccd5e3;
    border-radius:9px;
    font-size:16px;
}

button{
    padding:11px 14px;
    border:0;
    border-radius:8px;
    background:#0066ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.login button{
    width:100%;
    margin-top:15px;
    padding:14px;
}

.hidden{
    display:none!important;
}

.dashboard{
    display:grid;
    grid-template-columns:
    repeat(4,1fr);
    gap:12px;
}

.stat{
    background:#eef5ff;
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.stat-title{
    color:#555;
    font-weight:bold;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
    color:#0066ff;
    margin-top:7px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.section-header h2{
    margin:0;
    color:#0066ff;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

td{
    padding:11px;
    border-bottom:1px solid #e7
