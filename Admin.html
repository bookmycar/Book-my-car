header{

.car-refresh{

.booking-card,
.car-card{

}

.booking-card h3,

}

.car-card{

}

.info{

}

.confirmed{

    color:#0f5132;

.cancelled{

}

.available{
    background:#d1e7dd;

}

.action-buttons{
    display:flex;

    margin-top:14px;
    flex-wrap:wrap;
}

.confirm-btn{
    background:#198754;
}

.cancel-btn{
    background:#dc3545;
}

.delete-btn{
    background:#6c757d;
}

.section{
    margin-top:30px;
    padding-top:10px;
    border-top:2px solid #eee;
}

.section-title{
    background:#eef5ff;
    padding:12px;
    border-radius:8px;
    color:#0056d6;

}

.car-title{
    background:#eaf8ef;

}

.empty{

}

.loading{

}

.count-box{

@media(max-width:600px){

    }

</style>
</head>

<body>

<header>
    <h1>🚗 Book My Car - Admin Panel</h1>
</header>

<div class="container">

<!-- =========================
     LOGIN
========================= -->

<div class="login-box" id="loginBox">

    <input
        type="email"
        id="email"

        autocomplete="email"
    >

    <input

        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button
        class="login-btn"
        onclick="adminLogin()"
    >
        Login
    </button>

    <div id="error"></div>

<!-- =========================
     DASHBOARD
========================= -->

    id="dashboard"
    style="display:none;"
>

<button
    class="logout-btn"
    onclick="adminLogout()"
>
    Logout
</button>

<h2>📊 Admin Dashboard</h2>


<!-- =========================
     BOOKINGS
========================= -->

<div class="section">

    <div class="section-title">

        <span class="count-box" id="bookingCount">
            0
        </span>
    </div>

    <br>

    <button
        class="refresh-btn"
        onclick="loadBookings()"
    >
        🔄 Refresh Bookings
    </button>

    <div id="bookingList">
        Loading...
    </div>

</div>


<!-- =========================
     CARS
========================= -->

<div class="section">

    <div class="section-title car-title">
        🚗 Added Cars
        <span class="count-box" id="carCount">
            0
        </span>
    </div>

    <br>

    <button
        class="refresh-btn car-refresh"
        onclick="loadCars()"
    >
        🔄 Refresh Cars
    </button>

    <div id="carList">
        Cars loading...
    </div>

</div>

</div>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

    authDomain:
    "book-my-car-a97cf.firebaseapp.com",

    projectId:
    "book-my-car-a97cf",

    storageBucket:
    "book-my-car-a97cf.firebasestorage.app",

    messagingSenderId:
    "546652899903",

    appId:
    "1:546652899903:web:c280a58db101e01d1d468a"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   LOGIN
========================= */

window.adminLogin = async function(){

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const error =
        document.getElementById("error");

    error.innerText = "";

    if(email === "" ||
       password === ""){

        error.innerText =
        "Email और Password भरें।";

        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(e){

        console.error(e);

        if(e.code ===
           "auth/invalid-credential"){

            error.innerText =
            "❌ Email या Password गलत है।";

        }
        else if(e.code ===
                "auth/user-not-found"){

            error.innerText =
            "❌ Admin user नहीं मिला।";

        }
        else if(e.code ===
                "auth/wrong-password"){

            error.innerText =
            "❌ Password गलत है।";

        }
        else{

            error.innerText =
            "❌ Login failed: " +
            e.message;
        }
    }
};


/* =========================
   LOGOUT
========================= */

window.adminLogout = async function(){

    try{

        await signOut(auth);

    }
    catch(e){

        console.error(e);

    }
};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            document.getElementById(
                "loginBox"
            ).style.display = "none";

            document.getElementById(
                "dashboard"
            ).style.display = "block";

            loadBookings();

            loadCars();

        }
        else{

            document.getElementById(
                "loginBox"
            ).style.display = "block";

            document.getElementById(
                "dashboard"
            ).style.display = "none";

        }

    }
);


/* =========================
   LOAD BOOKINGS
========================= */

window.loadBookings = async function(){

    const list =
        document.getElementById(
            "bookingList"
        );

    const count =
        document.getElementById(
            "bookingCount"
        );

    list.innerHTML =
    '<div class="loading">⏳ Bookings loading...</div>';

    try{

        /*
         * orderBy हटाया गया है।
         *
         * इससे createdAt field missing होने पर
         * भी bookings load होंगी।
         */

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "bookings"
                )
            );

        count.innerText =
            snapshot.size;

        if(snapshot.empty){

            list.innerHTML =
            '<div class="empty">' +
            'अभी कोई booking नहीं है।' +
            '</div>';

            return;
        }


        let bookings = [];

        snapshot.forEach(
            bookingDoc => {

                bookings.push({

                    id:bookingDoc.id,

                    data:bookingDoc.data()

                });

            }
        );


        /*
         * createdAt मौजूद हो तो newest पहले
         */

        bookings.sort(
            (a,b) => {

                const aTime =
                    getTime(
                        a.data.createdAt
                    );

                const bTime =
                    getTime(
                        b.data.createdAt
                    );

                return bTime - aTime;

            }
        );


        list.innerHTML = "";


        bookings.forEach(
            booking => {

                const data =
                    booking.data;

                const id =
                    booking.id;


                const status =
                    data.status ||
                    "Pending";


                let statusClass =
                    "pending";


                if(status === "Confirmed"){

                    statusClass =
                    "confirmed";

                }


                if(status === "Cancelled"){

                    statusClass =
                    "cancelled";

                }


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "booking-card";


                card.innerHTML = `

                    <h3>
                        🚗 ${escapeHTML(
                            data.car ||
                            data.carName ||
                            "Car"
                        )}
                    </h3>

                    <div class="info">
                        <b>Booking ID:</b>
                        ${escapeHTML(id)}
                    </div>

                    <div class="info">
                        👤 <b>Customer:</b>
                        ${escapeHTML(
                            data.customer ||
                            data.name ||
                            "-"
                        )}
                    </div>

                    <div class="info">
                        📞 <b>Mobile:</b>
                        ${escapeHTML(
                            data.phone ||
                            data.mobile ||
                            "-"
                        )}
                    </div>

                    <div class="info">
                        📍 <b>From:</b>
                        ${escapeHTML(
                            data.pickup ||
                            data.from ||
                            "-"
                        )}
                    </div>

                    <div class="info">
                        🏁 <b>To:</b>
                        ${escapeHTML(
                            data.drop ||
                            data.to ||
                            "-"
                        )}
                    </div>

                    <div class="info">
                        📅 <b>Date:</b>
                        ${escapeHTML(
                            data.date ||
                            "-"
                        )}
                    </div>

                    <div class="info">
                        ⏰ <b>Time:</b>
                        ${escapeHTML(
                            data.time ||
                            "-"
                        )}
                    </div>

                    <div class="info">
                        💰 <b>Total Amount:</b>
                        ₹${escapeHTML(
                            data.total ||
                            data.amount ||
                            data.rent ||
                            "0"
                        )}
                    </div>

                    <div class="info">
                        💵 <b>Advance:</b>
                        ₹${escapeHTML(
                            data.advance ||
                            "0"
                        )}
                    </div>

                    <div class="info">
                        👨‍✈️ <b>Driver:</b>
                        ${escapeHTML(
                            data.driver ||
                            data.driverName ||
                            "Pending"
                        )}
                    </div>

                    <div class="info">
                        🚘 <b>Owner:</b>
                        ${escapeHTML(
                            data.owner ||
                            data.ownerName ||
                            "Pending"
                        )}
                    </div>

                    <div class="info">

                        <b>Status:</b>

                        <span class="status ${statusClass}">
                            ${escapeHTML(status)}
                        </span>

                    </div>

                    <div class="action-buttons">

                        <button
                            class="confirm-btn"
                            onclick="updateStatus(
                                '${escapeHTML(id)}',
                                'Confirmed'
                            )"
                        >
                            ✅ Confirm
                        </button>

                        <button
                            class="cancel-btn"
                            onclick="updateStatus(
                                '${escapeHTML(id)}',
                                'Cancelled'
                            )"
                        >
                            ❌ Cancel
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteBooking(
                                '${escapeHTML(id)}'
                            )"
                        >
                            🗑 Delete
                        </button>

                    </div>
                `;


                list.appendChild(card);

            }
        );

    }
    catch(error){

        console.error(
            "BOOKING ERROR:",
            error
        );

        count.innerText = "0";

        list.innerHTML =
        `
        <div class="firebase-error">

            ❌ <b>Booking load नहीं हुई।</b>

            <br><br>

            Error:
            ${escapeHTML(error.message)}

            <br><br>

            Firestore में
            <b>bookings</b>
            collection और Rules check करें।

        </div>
        `;

    }
};
