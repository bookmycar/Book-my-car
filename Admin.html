<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Book My Car - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#075bd3,#003caa);
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-size:21px;
}

.logout{
  background:white;
  color:#075bd3;
  border:0;
  padding:9px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 8px 30px #0002;
}

.login-box h2{
  text-align:center;
  margin:0 0 8px;
}

.login-box p{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd5e3;
  border-radius:8px;
  margin-bottom:16px;
  font-size:15px;
}

.login-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#075bd3;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
}

.error{
  margin-top:15px;
  padding:10px;
  border-radius:7px;
  background:#fee2e2;
  color:#b91c1c;
  display:none;
  text-align:center;
}

.success{
  margin-top:15px;
  padding:10px;
  border-radius:7px;
  background:#dcfce7;
  color:#166534;
  display:none;
  text-align:center;
}

#adminPanel{
  display:none;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 15px #0001;
}

.card span{
  color:#666;
}

.card strong{
  display:block;
  font-size:28px;
  color:#075bd3;
  margin-top:8px;
}

.section{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 15px #0001;
}

.section h2{
  margin-top:0;
}

.refresh{
  background:#075bd3;
  color:white;
  border:0;
  border-radius:7px;
  padding:9px 14px;
  cursor:pointer;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}

th{
  background:#f1f5f9;
}

.btn{
  border:0;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin:2px;
}

.confirm{
  background:#16a34a;
  color:white;
}

.cancel{
  background:#dc2626;
  color:white;
}

.delete{
  background:#111827;
  color:white;
}

.pending{
  color:#d97706;
  font-weight:bold;
}

.confirmed{
  color:#16a34a;
  font-weight:bold;
}

.cancelled{
  color:#dc2626;
  font-weight:bold;
}

.loading{
  padding:20px;
  text-align:center;
  color:#666;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

@media(max-width:700px){

  header h1{
    font-size:17px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }

  .login-box{
    padding:22px;
  }
}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

  <div class="login-box">

    <h2>🚗 Book My Car</h2>

    <p>Admin Panel Login</p>

    <form id="loginForm">

      <label for="email">
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        placeholder
