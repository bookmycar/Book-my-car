<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Book My Car - Customer Booking</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#075bd3,#003caa);
  color:#fff;
  padding:22px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
}

.wrap{
  max-width:820px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 20px #00000012;
  margin-bottom:18px;
}

h2{
  margin-top:0;
  color:#075bd3;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd5e3;
  border-radius:9px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#075bd3;
  box-shadow:0 0 0 3px #075bd31a;
}

.radioBox{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.radioItem{
  flex:1;
  min-width:140px;
  border:1px solid #ccd5e3;
  border-radius:10px;
  padding:12px;
  cursor:pointer;
  background:#fff;
}

.radioItem input{
  width:auto;
  margin-right:6px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#075bd3;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.calculate{
  background:#0b8f4d;
}

.secondary{
  background:#475467;
}

.msg{
  display:none;
  padding:13px;
  border-radius:9px;
  margin-bottom:14px;
  font-weight:700;
}

.success{
  display:block;
  background:#dff7e6;
  color:#16733a;
}

.error{
  display:block;
  background:#ffe1e1;
  color:#a50000;
}

.info{
  display:block;
  background:#e8f1ff;
  color:#0751ad;
}

.note{
  font-size:13px;
  color:#667085;
}

.result{
  background:#f7f9fc;
  border:1px solid #dce3ee;
  border-radius:12px;
  padding:16px;
  margin-top:15px;
}

.resultRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #e7ebf1;
}

.resultRow:last-child{
  border-bottom:0;
}

.resultRow strong{
  color:#075bd3;
}

.total{
  font-size:22px;
  font-weight:800;
  color:#0b8f4d !important;
}

.loading{
  color:#667085;
  font-size:14px;
  margin-top:8px;
}

.hidden{
  display:none !important;
}

.back{
  display:inline-block;
  margin-top:15px;
  color:#075bd3;
  text-decoration:none;
  font-weight:700;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  header h1{
    font-size:24px;
  }

  .card{
    padding:17px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚗 Book My Car</h1>
  <p>Customer Booking</p>
</header>

<div class="wrap">

<div class="card">

<h2>📋 अपनी Booking करें</h2>

<div id="msg" class="msg"></div>

<form id="bookingForm">

<div class="grid">

<div>
<label for="customerName">Customer Name *</label>
<input id="customerName" required placeholder="आपका नाम">
</div>

<div>
<label for="mobile">Mobile Number *</label>
<input
 id="mobile"
 required
 inputmode="numeric"
 pattern="[0-9]{10}"
 maxlength="10"
 placeholder="10 digit mobile">
</div>

<div>
<label for="carId">Car *</label>

<select id="carId" required>
<option value="">Cars loading...</option>
</select>

<div id="carLoading" class="loading"></div>
</div>

<div>
<label for="bookingDate">Booking Date *</label>
<input id="bookingDate" type="date" required>
</div>

<div>
<label for="pickup">Pickup Location *</label>
<input id="pickup" required placeholder="जैसे Sarangarh">
</div>

<div>
<label for="destination">Destination *</label>
<input id="destination" required placeholder="जैसे Raigarh">
</div>

<div>
<label for="pickupTime">Pickup Time *</label>
<input id="pickupTime" type="time" required>
</div>

<div>
<label for="passengers">Passengers</label>
<input
 id="passengers"
 type="number"
 min="1"
 max="50"
 value="1">
</div>

<div class="full">

<label>Trip Type *</label>

<div class="radioBox">

<label class="radioItem">
<input
 type="radio"
 name="tripType"
 value="local"
 checked>
 Local Trip
</label>

<label class="radioItem">
<input
 type="radio"
 name="tripType"
 value="outstation">
 Outstation
</label>

</div>

</div>

<div class="full">

<label class="radioItem">

<input
 id="roundTrip"
 type="checkbox">

🔄 Round Trip

</label>

</div>

<div class="full">

<button
 type="button"
 id="calculateBtn"
 class="calculate">

📍 Distance & Fare Calculate करें

</button>

</div>

</div>

<div
 id="calculationBox"
 class="result hidden">

<div class="resultRow">
<span>One Way Distance</span>
<strong id="oneWayDistance">0 km</strong>
</div>

<div class="resultRow">
<span>Total Distance</span>
<strong id="totalDistance">0 km</strong>
</div>

<div class="resultRow">
<span>Trip Type</span>
<strong id="showTripType">Local</strong>
</div>

<div class="resultRow">
<span>Rate / KM</span>
<strong id="showRate">₹0</strong>
</div>

<div class="resultRow">
<span>Calculated Fare</span>
<strong
 id="totalFare"
 class="total">
₹0
</strong>
</div>

<div
 id="fuelNote"
 class="note">
</div>

</div>

<div class="full">

<label for="notes">
Extra Requirement
</label>

<textarea
 id="notes"
 placeholder="कोई खास जानकारी हो तो लिखें"></textarea>

</div>

<button
 id="bookBtn"
 type="submit">

🚗 Booking Confirm करें

</button>

</form>

<p class="note">
Booking submit होने के बाद Admin Panel में request दिखाई देगी।
</p>

<a
 class="back"
 href="index.html">

← Home पर वापस जाएँ

</a>

</div>
</div>
