/* =========================

========================= */

let cars = [];

/* =========================
   DATE
========================= */

const today = new Date();
const todayString =
 today.getFullYear() + "-" +
 String(today.getMonth()+1).padStart(2,"0") + "-" +
 String(today.getDate()).padStart(2,"0");

bookingDate.min = todayString;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type="info"){
 msg.textContent = text;
 msg.className = "msg " + type;
}


/* =========================
   NUMBER HELPERS
========================= */

function numberValue(value){

 if(value === null || value === undefined || value === ""){
   return 0;
 }

 const n = Number(
   String(value)
   .replace(/₹/g,"")
   .replace(/,/g,"")
   .replace(/[^\d.-]/g,"")
 );

 return Number.isFinite(n) ? n : 0;
}


function money(value){
 return "₹" + Math.round(numberValue(value)).toLocaleString("en-IN");
}


/* =========================
   FIND RATE
========================= */

function getRate(car){

 /*
  अलग-अलग पुराने AddCar versions में
  अलग नाम हो सकते हैं।
 */

 const possibleRates = [
   car.rateKm,
   car.ratePerKm,
   car.ratePerKM,
   car.rate_km,
   car.kmRate,
   car.perKm,
   car.pricePerKm
 ];

 for(const value of possibleRates){

   const n = numberValue(value);

   if(n > 0){
     return n;
   }
 }

 return 0;
}


/* =========================
   FIND RENT
========================= */

function getRent(car){

 const possibleRents = [
   car.rent,
   car.localRate,
   car.localRent,
   car.dailyRent,
   car.price
 ];

 for(const value of possibleRents){

   const n = numberValue(value);

   if(n > 0){
     return n;
   }
 }

 return 0;
}


/* =========================
   LOAD CARS
========================= */

async function loadCars(){

 loading.textContent = "Cars load हो रही हैं...";

 try{

   const snap =
     await getDocs(collection(db,"cars"));

   cars = [];

   carId.innerHTML =
     '<option value="">Car चुनें</option>';

   snap.forEach(docSnap => {

     const car = docSnap.data();

     /*
       Rejected cars को hide करें
     */

     const status =
       String(car.status || "").toLowerCase();

     if(status === "rejected"){
       return;
     }

     if(car.available === false){
       return;
     }

     const rate = getRate(car);
     const rent = getRent(car);

     const item = {
       id:docSnap.id,
       ...car,
       _rateKm:rate,
       _rent:rent
     };

     cars.push(item);

     const option =
       document.createElement("option");

     option.value = docSnap.id;

     const name =
       car.carName ||
       car.name ||
       car.car ||
       "Car";

     let priceText = "";

     if(rate > 0){
       priceText =
         " ₹" +
         rate.toLocaleString("en-IN") +
         "/KM";
     }
     else if(rent > 0){
       priceText =
         " " +
         money(rent);
     }

     option.textContent =
       name + priceText;

     carId.appendChild(option);

   });


   if(cars.length === 0){

     carId.innerHTML =
       '<option value="">अभी कोई car उपलब्ध नहीं</option>';

     loading.textContent =
       "Firebase में कोई available car नहीं मिली।";

     showMessage(
       "अभी कोई car उपलब्ध नहीं है। पहले AddCar.html से car save करें।",
       "error"
     );

     return;
   }

   loading.textContent =
     cars.length + " car उपलब्ध हैं।";


 }catch(error){

   console.error("CAR LOAD ERROR:",error);

   carId.innerHTML =
     '<option value="">Cars load नहीं हुईं</option>';

   loading.textContent =
     "Firebase error";

   showMessage(
     "Cars load नहीं हो पाईं। Firebase Firestore Rules/connection check करें। " +
     error.message,
     "error"
   );
 }
}


/* =========================
   SELECT CAR
========================= */

carId.addEventListener("change",function(){

 selectedCarData =
   cars.find(car => car.id === carId.value) || null;

 calculationBox.classList.add("hidden");

 calculatedDistance = 0;
 calculatedTotalDistance = 0;
 calculatedFare = 0;

 if(selectedCarData){

   console.log("Selected car:",selectedCarData);

 }

});


/* =========================
   GEOCODING
========================= */

async function geocode(place){

 const url =
   "https://nominatim.openstreetmap.org/search" +
   "?format=json" +
   "&limit=1" +
   "&q=" +
   encodeURIComponent(place + ", India");

 const response =
   await fetch(url,{
     headers:{
       "Accept":"application/json"
     }
   });

 if(!response.ok){
   throw new Error("Location service unavailable");
 }

 const data =
   await response.json();

 if(!data || !data.length){
   throw new Error(
     "Location नहीं मिली: " + place
   );
 }

 return {
   lat:Number(data[0].lat),
   lon:Number(data[0].lon),
   display:data[0].display_name
 };
}
