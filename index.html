<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - Online Booking</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:linear-gradient(135deg,#075bd3,#003caa);color:#fff;padding:24px 16px;text-align:center}header h1{margin:0;font-size:29px}.wrap{max-width:900px;margin:24px auto;padding:0 14px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #0001}h2{color:#075bd3;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:7px 0}input,select,textarea{width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:9px;font-size:16px}textarea{min-height:85px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#075bd3;color:#fff;font-size:17px;font-weight:700;margin-top:8px}.calculate{background:#0b8f4d}.msg{display:none;padding:12px;border-radius:9px;margin:10px 0;font-weight:700}.show{display:block}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.info{background:#e8f1ff;color:#0751ad}.small{font-size:13px;color:#667085}.result{background:#f7faff;border:1px solid #dce6f3;border-radius:12px;padding:15px;margin-top:14px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #e5eaf1}.row:last-child{border:0}.total{font-size:24px;color:#0b8f4d}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><h1>🚗 Book My Car</h1><p>सुरक्षित और आसान Car Booking Service</p></header><div class="wrap"><div class="card"><h2>📋 अपनी Booking करें</h2><div id="msg" class="msg"></div><form id="bookingForm"><div class="grid"><div><label>Customer Name *</label><input id="customerName" required placeholder="अपना नाम"></div><div><label>Mobile Number *</label><input id="mobile" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile"></div><div><label>Select Car *</label><select id="carId" required><option>Cars loading...</option></select><div id="carLoading" class="small">Cars load हो रही हैं...</div></div><div><label>Booking Date *</label><input id="bookingDate" type="date" required></div><div><label>Pickup Location *</label><input id="pickup" required placeholder="जैसे Sarangarh"></div><div><label>Destination *</label><input id="destination" required placeholder="जैसे Raigarh"></div><div><label>Pickup Time *</label><input id="pickupTime" type="time" required></div><div><label>Passengers</label><input id="passengers" type="number" min="1" max="50" value="1"></div><div class="full"><label>Trip Type *</label><label><input type="radio" name="tripType" value="local" checked style="width:auto"> 🏠 Local (Fixed 100 KM)</label><label><input type="radio" name="tripType" value="outstation" style="width:auto"> 🛣️ Outstation</label></div><div class="full"><label><input id="roundTrip" type="checkbox" style="width:auto"> 🔄 Round Trip</label></div><div class="full"><label><input id="carLoadingOption" type="checkbox" style="width:auto"> 📦 Car Loading / सामान</label></div><div class="full"><button type="button" id="calculateBtn" class="calculate">📍 Distance & Fare Calculate करें</button></div></div><div id="calculationBox" class="result hidden"><div class="row"><span>One Way Distance</span><strong id="oneWayDistance">0 km</strong></div><div class="row"><span>Total Distance</span><strong id="totalDistance">0 km</strong></div><div class="row"><span>Trip Type</span><strong id="showTripType">Local</strong></div><div id="rateRow" class="row hidden"><span>Rate / KM</span><strong id="showRate">₹0</strong></div><div class="row"><span>Base Fare</span><strong id="baseFare">₹0</strong></div><div class="row"><span>Car Loading</span><strong id="loadingFare">₹0</strong></div><div class="row"><span>Total Fare</span><strong id="totalFare" class="total">₹0</strong></div><div id="fuelNote" class="small"></div></div><div class="full"><label>Extra Requirement</label><textarea id="notes" placeholder="कोई खास जानकारी हो तो लिखें"></textarea></div><button id="bookBtn" type="submit">🚗 Booking Confirm करें</button></form><p class="small">Booking submit होने के बाद Admin Panel में request दिखाई देगी।</p></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getFirestore,collection,getDocs,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA',authDomain:'book-my-car-a97cf.firebaseapp.com',projectId:'book-my-car-a97cf',storageBucket:'book-my-car-a97cf.firebasestorage.app',messagingSenderId:'546652899903',appId:'1:546652899903:web:c280a58db101e01d1d468a'};const db=getFirestore(initializeApp(cfg));const $=id=>document.getElementById(id);const form=$('bookingForm'),carId=$('carId'),msg=$('msg'),carLoading=$('carLoading'),calc=$('calculationBox');let cars=[],selected=null,dist=0,totalDist=0,fare=0;function message(t,c='info'){msg.textContent=t;msg.className='msg show '+c}function num(v){let n=Number(String(v??0).replace(/[^\d.-]/g,''));return Number.isFinite(n)?n:0}function money(v){return'₹'+Math.round(num(v)).toLocaleString('en-IN')}function carName(c){return c.carName||c.name||c.vehicleName||c.car||'Car'}function rate(c){return num(c.ratePerKm??c.rate??c.localRate??c.outstationRate)}function rent(c){return num(c.localFare??c.rent??c.perDayRent??c.dailyRent)}
async function loadCars(){carLoading.textContent='Cars load हो रही हैं...';try{const s=await getDocs(collection(db,'cars'));cars=s.docs.map(d=>({id:d.id,...d.data()}));const a=cars.filter(c=>{const st=String(c.status||'available').toLowerCase();return !['unavailable','inactive','rejected'].includes(st)&&c.available!==false});carId.innerHTML='<option value="">-- Available Car Select करें --</option>';a.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=carName(c)+' — Available';carId.appendChild(o)});carLoading.textContent=a.length?a.length+' car available':'अभी कोई available car नहीं मिली';if(!a.length)message('अभी कोई available car नहीं मिली।','error')}catch(e){console.error(e);carId.innerHTML='<option value="">Cars load नहीं हो पाईं</option>';carLoading.textContent='Firebase error: '+e.message;message('Cars load नहीं हो पाईं: '+e.message,'error')}}
carId.onchange=()=>{selected=cars.find(c=>c.id===carId.value)||null;calc.classList.add('hidden')};
async function geocode(q){const url='https://photon.komoot.io/api/?'+new URLSearchParams({q:q+', India',limit:'1'});const r=await fetch(url);if(!r.ok)throw Error('Location service unavailable');const d=await r.json();if(!d.features?.length)throw Error('Location नहीं मिली: '+q);const p=d.features[0].geometry.coordinates;return{lat:p[1],lon:p[0]}}
async function distance(a,b){const A=await geocode(a),B=await geocode(b);const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lon},${A.lat};${B.lon},${B.lat}?overview=false`);if(!r.ok)throw Error('Route service unavailable');const d=await r.json();if(!d.routes?.length)throw Error('Route नहीं मिली');return d.routes[0].distance/1000}
$('calculateBtn').onclick=async()=>{message('Fare calculate हो रहा है...','info');if(!selected)return message('पहले Car select करें।','error');if(!$('pickup').value.trim()||!$('destination').value.trim())return message('Pickup और Destination दोनों भरें।','error');const b=$('calculateBtn');b.disabled=true;b.textContent='⏳ Calculate हो रहा है...';try{const isLocal=document.querySelector('input[name="tripType"]:checked').value==='local';if(isLocal){dist=100;totalDist=$('roundTrip').checked?200:100}else{dist=await distance($('pickup').value.trim(),$('destination').value.trim());totalDist=$('roundTrip').checked?dist*2:dist}const r=rate(selected);const base=isLocal?rent(selected):(r>0?totalDist*r:rent(selected));const loading=$('carLoadingOption').checked?500:0;fare=base+loading;$('oneWayDistance').textContent=dist.toFixed(0)+' km';$('totalDistance').textContent=totalDist.toFixed(0)+' km';$('showTripType').textContent=isLocal?'Local (Fixed 100 KM)':'Outstation';$('rateRow').classList.toggle('hidden',isLocal);$('showRate').textContent=money(r);$('baseFare').textContent=money(base);$('loadingFare').textContent=money(loading);$('totalFare').textContent=money(fare);$('fuelNote').textContent=isLocal?'Local trip का distance fixed 100 KM है; Rate/KM लागू नहीं है.':(r>0?'Outstation fare Rate/KM के अनुसार calculate हुआ है.':'Rate/KM नहीं मिला, इसलिए Local Rent इस्तेमाल किया गया है.');calc.classList.remove('hidden');message('✅ Fare successfully calculate हो गया।','success')}catch(e){console.error(e);message('❌ Calculation नहीं हुआ: '+e.message,'error')}finally{b.disabled=false;b.textContent='📍 Distance & Fare Calculate करें'}};
form.onsubmit=async e=>{e.preventDefault();const m=$('mobile').value.trim();if(!/^[0-9]{10}$/.test(m))return message('कृपया 10 digit mobile number डालें।','error');if(!selected)return message('Car select करें।','error');if(!totalDist)return message('पहले Distance & Fare Calculate करें।','error');const b=$('bookBtn');b.disabled=true;b.textContent='⏳ Booking save हो रही है...';try{const isLocal=document.querySelector('input[name="tripType"]:checked').value==='local';const d=await addDoc(collection(db,'bookings'),{customerName:$('customerName').value.trim(),mobile:m,carId:selected.id,carName:carName(selected),pickup:$('pickup').value.trim(),destination:$('destination').value.trim(),date:$('bookingDate').value,pickupTime:$('pickupTime').value,passengers:Number($('passengers').value||1),tripType:isLocal?'local':'outstation',roundTrip:$('roundTrip').checked,distanceKm:dist,totalDistanceKm:totalDist,totalFare:fare,carLoading:$('carLoadingOption').checked,notes:$('notes').value.trim(),status:'Pending',createdAt:serverTimestamp()});message('✅ Booking successfully submit हो गई। Booking ID: '+d.id,'success');form.reset();$('bookingDate').min=new Date().toISOString().slice(0,10);carId.value='';selected=null;totalDist=0;calc.classList.add('hidden')}catch(e){message('❌ Booking submit नहीं हुई: '+e.message,'error')}finally{b.disabled=false;b.textContent='🚗 Booking Confirm करें'}};
$('bookingDate').min=new Date().toISOString().slice(0,10);loadCars();
</script></body></html>
