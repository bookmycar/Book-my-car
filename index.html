<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - Customer Booking</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}header{background:linear-gradient(135deg,#075bd3,#00a878);color:#fff;padding:25px 16px;text-align:center}header h1{margin:0;font-size:30px}.wrap{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 6px 24px #0001}h2{color:#075bd3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:7px 0}input,select,textarea{width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#075bd3;color:#fff;font-size:17px;font-weight:700;margin-top:8px}.green{background:#0b8f4d}.msg{display:none;padding:12px;border-radius:9px;margin:10px 0;font-weight:700}.show{display:block}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.result{background:#f7faff;border:1px solid #dce6f3;border-radius:12px;padding:15px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #e5eaf1}.total{font-size:25px;color:#0b8f4d}.hidden{display:none!important}.note{font-size:14px;color:#667085;text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><h1>🚗 Book My Car</h1><p>Customer Car Booking</p></header><div class="wrap"><section class="card"><h2>📋 अपनी Car Book करें</h2><p class="note">Available car चुनें। Owner/Driver की निजी जानकारी customer को नहीं दिखाई जाएगी।</p><div id="msg" class="msg"></div><form id="bookingForm"><div class="grid"><div><label>Customer Name *</label><input id="customerName" required></div><div><label>Mobile Number *</label><input id="mobile" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10"></div><div><label>Pickup Location *</label><input id="pickup" required placeholder="Sarangarh"></div><div><label>Destination *</label><input id="destination" required placeholder="Raigarh"></div><div><label>Booking Date *</label><input id="bookingDate" type="date" required></div><div><label>Pickup Time *</label><input id="pickupTime" type="time" required></div><div><label>Passengers</label><input id="passengers" type="number" min="1" max="50" value="1"></div><div><label>Trip / Route Type *</label><select id="tripType" required><option value="oneway">➡️ One Way</option><option value="roundtrip">🔄 Round Trip</option></select></div><div class="full"><label>Available Car *</label><select id="carId" required><option value="">Available Cars loading...</option></select></div><div class="full"><div id="carInfo" class="result hidden"></div></div><div class="full"><button type="button" id="calculateBtn" class="green">📍 Route & Fare Calculate करें</button></div></div><div id="calculationBox" class="result hidden"><div class="row"><span>One Way Distance</span><strong id="oneWayDistance">0 km</strong></div><div class="row"><span>Trip Type</span><strong id="showTripType">One Way</strong></div><div class="row"><span>Total Distance</span><strong id="totalDistance">0 km</strong></div><div class="row"><span>Fare Type</span><strong id="fareType">-</strong></div><div class="row"><span>Rate / Fixed Fare</span><strong id="showRate">-</strong></div><div class="row"><span>Total Fare</span><strong id="totalFare" class="total">₹0</strong></div></div><label>Extra Requirement</label><textarea id="notes"></textarea><button id="bookBtn">🚗 Booking Confirm करें</button></form></section></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getFirestore,collection,getDocs,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const cfg={apiKey:'AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA',authDomain:'book-my-car-a97cf.firebaseapp.com',projectId:'book-my-car-a97cf',storageBucket:'book-my-car-a97cf.firebasestorage.app',messagingSenderId:'546652899903',appId:'1:546652899903:web:c280a58db101e01d1d468a'},db=getFirestore(initializeApp(cfg)),$=id=>document.getElementById(id);let cars=[],selected=null,dist=0,fare=0;const money=v=>'₹'+Math.round(Number(v)||0).toLocaleString('en-IN'),name=c=>c.carName||'Car',rate=c=>Number(c.ratePerKm||0);function message(t,c='info'){$('msg').textContent=t;$('msg').className='msg show '+c}async function loadCars(){try{const s=await getDocs(collection(db,'publicCars'));cars=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>String(c.status||'available').toLowerCase()==='available');$('carId').innerHTML=cars.length?'<option value="">-- Available Car Select करें --</option>'+cars.map(c=>'<option value="'+c.id+'">'+name(c)+' — Available</option>').join(''):'<option value="">अभी कोई car available नहीं है</option>'}catch(e){message('Cars load नहीं हो पाईं: '+e.message,'error')}}$('carId').onchange=()=>{selected=cars.find(c=>c.id===$('carId').value)||null;const b=$('carInfo');if(!selected){b.classList.add('hidden');return}b.innerHTML='<b>🚗 '+name(selected)+'</b><br>✅ Available<br><br><b>Rate:</b> ₹'+rate(selected)+'/KM<br><span class="note">Fixed route होने पर route fare लागू होगा।</span>';b.classList.remove('hidden');$('calculationBox').classList.add('hidden');fare=0};async function geo(q){const r=await fetch('https://photon.komoot.io/api/?'+new URLSearchParams({q:q+', India',limit:'1'}));if(!r.ok)throw Error('Location service unavailable');const d=await r.json();if(!d.features?.length)throw Error('Location नहीं मिली: '+q);const p=d.features[0].geometry.coordinates;return{lat:p[1],lon:p[0]}}async function distance(a,b){const A=await geo(a),B=await geo(b),r=await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lon},${A.lat};${B.lon},${B.lat}?overview=false`);if(!r.ok)throw Error('Route service unavailable');const d=await r.json();if(!d.routes?.length)throw Error('Route नहीं मिली');return d.routes[0].distance/1000}function fixed(c,a,b){const n=x=>String(x||'').trim().toLowerCase();return(c.fixedRoutes||[]).find(r=>n(r.from)===n(a)&&n(r.to)===n(b))?.fare||null}$('calculateBtn').onclick=async()=>{if(!selected)return message('पहले available car select करें।','error');const pickup=$('pickup').value.trim(),destination=$('destination').value.trim();if(!pickup||!destination)return message('Pickup और Destination भरें।','error');try{message('📍 Route और fare calculate हो रहा है...');const f=fixed(selected,pickup,destination),oneWay=await distance(pickup,destination),round=$('tripType').value==='roundtrip';dist=round?oneWay*2:oneWay;fare=(Number(f)||oneWay*rate(selected))*(round?2:1);$('oneWayDistance').textContent=oneWay.toFixed(1)+' km';$('showTripType').textContent=round?'Round Trip':'One Way';$('totalDistance').textContent=dist.toFixed(1)+' km';$('fareType').textContent=f?'Fixed Route Fare':'Per KM Fare';$('showRate').textContent=f?money(Number(f)*(round?2:1)):money(rate(selected))+'/KM';$('totalFare').textContent=money(fare);$('calculationBox').classList.remove('hidden');message('✅ Route और fare calculate हो गया।','success')}catch(e){message('❌ '+e.message,'error')}};$('bookingForm').onsubmit=async e=>{e.preventDefault();if(!selected)return message('पहले car select करें।','error');if(!fare)return message('पहले Route & Fare Calculate करें।','error');try{const oneWay=dist/($('tripType').value==='roundtrip'?2:1);await addDoc(collection(db,'bookings'),{customerName:$('customerName').value.trim(),mobile:$('mobile').value.trim(),carId:selected.id,carName:name(selected),ownerUid:selected.ownerUid||'',pickup:$('pickup').value.trim(),destination:$('destination').value.trim(),tripType:$('tripType').value,date:$('bookingDate').value,pickupTime:$('pickupTime').value,passengers:Number($('passengers').value||1),oneWayDistanceKm:Number(oneWay.toFixed(1)),distanceKm:Number(dist.toFixed(1)),totalFare:fare,status:'Pending',notes:$('notes').value.trim(),createdAt:serverTimestamp()});message('✅ आपकी Booking successfully submit हो गई।','success');$('bookingForm').reset();$('calculationBox').classList.add('hidden');$('carInfo').classList.add('hidden');fare=0;selected=null;dist=0;loadCars()}catch(e){message('❌ Booking submit नहीं हुई: '+e.message,'error')}};$('bookingDate').min=new Date().toISOString().slice(0,10);loadCars();</script></body></html>
