<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:linear-gradient(135deg,#0066ff,#00a8ff);
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
}

.container{
  width:94%;
  max-width:1100px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#075edb;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
}

input,select,button{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  border:0;
  background:#0066ff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#004dcc;
}

#map{
  height:350px;
  width:100%;
  border-radius:12px;
  margin-top:15px;
}

.location-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.info{
  background:#eef6ff;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.car-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.car{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
}

.car h3{
  margin-top:0;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#087b32;
}

.success{
  display:none;
  background:#dff7e6;
  color:#11652b;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.error{
  display:none;
  background:#ffe4e4;
  color:#9b111e;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:25px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <h1>🚗 Book My Car</h1>
  <p>अपनी पसंद की कार आसानी से बुक करें</p>
</header>

<div class="container">

  <!-- Cars -->
  <div class="card">
    <h2>🚘 उपलब्ध Cars</h2>

    <div id="carList" class="car-list">
      <p>Cars loading...</p>
    </div>
  </div>

  <!-- Booking -->
  <div class="card">

    <h2>📋 Booking Details</h2>

    <label>Customer Name</label>
    <input
      type="text"
      id="customerName"
      placeholder="अपना नाम लिखें"
    >

    <label>Mobile Number</label>
    <input
      type="tel"
      id="customerPhone"
      maxlength="10"
      placeholder="10 digit mobile number"
    >

    <label>Select Car</label>
    <select id="carSelect">
      <option value="">Car चुनें</option>
    </select>

    <label>Booking Date</label>
    <input type="date" id="bookingDate">

    <label>Pickup Time</label>
    <input type="time" id="bookingTime">

    <label>Pickup Location</label>
    <input
      type="text"
      id="pickup"
      placeholder="Pickup location"
    >

    <label>Drop Location</label>
    <input
      type="text"
      id="drop"
      placeholder="Drop location"
    >

    <div class="location-buttons">
      <button type="button" onclick="findPickup()">
        📍 Pickup Map पर खोजें
      </button>

      <button type="button" onclick="findDrop()">
        📍 Drop Map पर खोजें
      </button>
    </div>

    <div id="map"></div>

    <div class="info">
      <b>📏 Distance:</b>
      <span id="distance">0 km</span>
      <br><br>

      <b>💰 Estimated Fare:</b>
      <span id="fare">₹0</span>
    </div>

    <button onclick="submitBooking()">
      🚗 BOOK CAR NOW
    </button>

    <div id="success" class="success"></div>
    <div id="error" class="error"></div>

  </div>

</div>

<footer>
  Created by Arvind Mehar
</footer>

/* ================================

const firebaseConfig = {

  projectId: "YOUR_PROJECT_ID",

  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* ================================
   MAP
   ================================ */

let map;
let pickupMarker = null;
let dropMarker = null;

let pickupCoords = null;
let dropCoords = null;

let routeLine = null;

window.addEventListener("load", () => {

  map = L.map("map").setView(
    [21.6458, 83.3961],
    10
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

});


/* ================================
   LOCATION SEARCH
   ================================ */

async function searchLocation(query){

  if(!query){
    alert("Location लिखें");
    return null;
  }

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json&limit=1&q=" +
      encodeURIComponent(query);

    const response = await fetch(url);

    const data = await response.json();

    if(!data.length){

      alert("Location नहीं मिली");

      return null;
    }

    return {
      lat:parseFloat(data[0].lat),
      lon:parseFloat(data[0].lon),
      name:data[0].display_name
    };

  }catch(error){

    console.error(error);

    alert("Location search में समस्या हुई");

    return null;
  }
}


/* ================================
   PICKUP
   ================================ */

window.findPickup = async function(){

  const location =
    document.getElementById("pickup").value.trim();

  const result =
    await searchLocation(location);

  if(!result) return;

  pickupCoords = result;

  if(pickupMarker){

    map.removeLayer(pickupMarker);
  }

  pickupMarker =
    L.marker([
      result.lat,
      result.lon
    ])
    .addTo(map)
    .bindPopup("📍 Pickup")
    .openPopup();

  map.setView([
    result.lat,
    result.lon
  ],13);

  calculateRoute();

};


/* ================================
   DROP
   ================================ */

window.findDrop = async function(){

  const location =
    document.getElementById("drop").value.trim();

  const result =
    await searchLocation(location);

  if(!result) return;

  dropCoords = result;

  if(dropMarker){

    map.removeLayer(dropMarker);
  }

  dropMarker =
    L.marker([
      result.lat,
      result.lon
    ])
    .addTo(map)
    .bindPopup("📍 Drop")
    .openPopup();

  calculateRoute();

};
