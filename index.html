<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car - Car Booking</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f6ff;
    color:#222;
}

header{
    background:linear-gradient(135deg,#0066ff,#00a8ff);
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    margin:0;
    font-size:34px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 6px 25px rgba(0,0,0,.10);
}

h2{
    color:#0066ff;
    text-align:center;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #d2dbea;
    border-radius:9px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#0066ff;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#004dcc;
}

.car-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
    margin-top:15px;
}

.car{
    border:1px solid #dce5f5;
    border-radius:12px;
    padding:15px;
    background:#f9fbff;
    cursor:pointer;
}

.car:hover{
    border-color:#0066ff;
}

.car-name{
    font-size:19px;
    font-weight:bold;
    color:#0066ff;
}

.car-price{
    margin-top:8px;
    font-weight:bold;
}

.info{
    margin-top:15px;
    background:#eef5ff;
    padding:12px;
    border-radius:9px;
    font-size:14px;
}

.success{
    display:none;
    margin-top:15px;
    background:#e8f7ed;
    color:#176b32;
    padding:15px;
    border-radius:10px;
}

.error{
    display:none;
    margin-top:15px;
    background:#ffecec;
    color:#a00000;
    padding:15px;
    border-radius:10px;
}

.links{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.links a{
    flex:1;
    text-align:center;
    text-decoration:none;
    padding:12px;
    background:#eef5ff;
    color:#0066ff;
    border-radius:8px;
    font-weight:bold;
}

footer{
    text-align:center;
    color:#777;
    padding:25px;
}

@media(max-width:600px){

    header h1{
        font-size:28px;
    }

    .links{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<header>

<h1>🚗 Book My Car</h1>

<p>आपकी यात्रा, हमारी जिम्मेदारी</p>

</header>


<div class="container">

<div class="card">

<h2>🚘 Available Cars</h2>

<div id="carList" class="car-list">

लोड हो रहा है...

</div>


<h2 style="margin-top:30px;">
📝 Car Booking
</h2>


<label>
Customer Name *
</label>

<input
id="customerName"
type="text"
placeholder="अपना नाम"
>


<label>
Mobile Number *
</label>

<input
id="customerPhone"
type="tel"
maxlength="10"
placeholder="10 अंकों का मोबाइल नंबर"
>


<label>
Pickup Location *
</label>

<input
id="pickup"
type="text"
placeholder="जैसे - सारंगढ़"
>


<label>
Drop Location *
</label>

<input
id="drop"
type="text"
placeholder="जैसे - रायगढ़"
>


<label>
Booking Date *
</label>

<input
id="bookingDate"
type="date"
>


<label>
Booking Time *
</label>

<input
id="bookingTime"
type="time"
>


<label>
Select Car *
</label>

<select id="carSelect">

<option value="">
पहले Car चुनें
</option>

</select>


<label>
Advance Amount ₹
</label>

<input
id="advance"
type="number"
min="0"
placeholder="Advance राशि"
>


<div class="info">

🔒 Car Owner का mobile number booking से पहले customer को नहीं दिखाया जाएगा।

</div>


<button id="bookButton">

🚗 BOOK NOW

</button>


<div id="success" class="success"></div>

<div id="error" class="error"></div>


<div class="links">

<a href="AddCar.html">
🚘 अपनी Car Add करें
</a>

<a href="Admin.html">
🔐 Admin Panel
</a>

</div>

</div>

</div>


<footer>

Created by Arvind Mehar

<br>

© 2026 Book My Car

</footer>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getFirestore,
collection,
getDocs,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* Firebase Configuration */

const firebaseConfig = {

apiKey:
"AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",

authDomain:
"book-my-car-a97cf.firebaseapp.com",

projectId:
"book-my-car-a97cf",

storageBucket:
"book-my-car-a97cf.firebasestorage.app",

messagingSenderId:
"546652899903",

appId:
"1:546652899903:web:c280a58db101e01d1d468a"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


let cars = [];


const carList =
document.getElementById("carList");

const carSelect =
document.getElementById("carSelect");


/* Load Cars */

async function loadCars(){

try{

const snapshot =
await getDocs(
collection(db,"cars")
);

cars=[];

carList.innerHTML="";

carSelect.innerHTML=
'<option value="">Car चुनें</option>';


snapshot.forEach(doc=>{

const car={

id:doc.id,

...doc.data()

};


if(car.available === false){

return;

}


cars.push(car);


/* Dropdown */

const option =
document.createElement("option");

option.value =
car.id;

option.textContent =
`${car.carName} - ${car.seats || ""} Seater`;

carSelect.appendChild(option);


/* Card */

const div =
document.createElement("div");

div.className="car";

div.innerHTML=`

<div class="car-name">

🚗 ${car.carName || "Car"}

</div>

<div>

${car.carType || ""}

</div>

<div>

${car.seats || ""} Seater

</div>

<div class="car-price">

Local ₹${car.localRate || 0}/day

<br>

Outstation ₹${car.outstationRate || 0}/km

</div>

`;

div.onclick=()=>{

carSelect.value=car.id;

};


carList.appendChild(div);

});


if(cars.length===0){

carList.innerHTML=
"अभी कोई Available Car नहीं है।";

}

}catch(error){

console.error(error);

carList.innerHTML=
"Cars load नहीं हो पाईं। Firebase Rules check करें।";

}

}


loadCars();


/* Booking */

document
.getElementById("bookButton")
.addEventListener("click",async()=>{


const name =
document
.getElementById("customerName")
.value.trim();


const phone =
document
.getElementById("customerPhone")
.value.trim();


const pickup =
document
.getElementById("pickup")
.value.trim();


const drop =
document
.getElementById("drop")
.value.trim();


const date =
document
.getElementById("bookingDate")
.value;


const time =
document
.getElementById("bookingTime")
.value;


const carId =
carSelect.value;


const advance =
Number(
document
.getElementById("advance")
.value
) || 0;


const car =
cars.find(c=>c.id===carId);


const success =
document.getElementById("success");


const errorBox =
document.getElementById("error");


success.style.display="none";

errorBox.style.display="none";


if(
!name ||
!pickup ||
!drop ||
!date ||
!time ||
!car
){

errorBox.innerText=
"कृपया सभी जरूरी जानकारी भरें।";

errorBox.style.display="block";

return;

}


if(
!/^[6-9][0-9]{9}$/.test(phone)
){

errorBox.innerText=
"कृपया सही 10 अंकों का mobile number डालें।";

errorBox.style.display="block";

return;

}


const button =
document.getElementById("bookButton");

button.disabled=true;

button.innerText=
"⏳ Booking Save हो रही है...";


try{


const bookingData={

customer:name,

phone:phone,

pickup:pickup,

drop:drop,

date:date,

time:time,

advance:advance,

carId:car.id,

car:car.carName || "",

owner:car.ownerName || "",

driver:car.driverName || "",

status:"Pending",

createdAt:
serverTimestamp()

};


const bookingRef =
await addDoc(
collection(db,"bookings"),
bookingData
);


success.innerHTML=`

✅ <b>Booking Successfully Sent!</b>

<br><br>

Booking ID:

<b>${bookingRef.id}</b>

<br><br>

Status:

<b>Pending</b>

<br><br>

Admin confirmation के बाद आपको booking status बताया जाएगा।

`;


success.style.display="block";


document
.getElementById("customerName")
.value="";

document
.getElementById("customerPhone")
.value="";

document
.getElementById("pickup")
.value="";

document
.getElementById("drop")
.value="";

document
.getElementById("bookingDate")
.value="";

document
.getElementById("bookingTime")
.value="";

document
.getElementById("advance")
.value="";


carSelect.value="";


}catch(err){

console.error(err);

errorBox.innerText=
"❌ Booking save नहीं हुई: "+err.message;

errorBox.style.display="block";

}


button.disabled=false;

button.innerText=
"🚗 BOOK NOW";


});

</script>

</body>
</html>
