<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book My Car</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f3f7ff;
  color:#222;
}

header{
  background:linear-gradient(135deg,#0d6efd,#0047ab);
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
}

.container{
  width:94%;
  max-width:900px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#075dcc;
  font-size:21px;
}

.trip-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.trip-buttons button{
  padding:12px 5px;
  border:none;
  border-radius:10px;
  background:#e8f0ff;
  color:#075dcc;
  font-weight:bold;
  cursor:pointer;
}

.trip-buttons button.active{
  background:#0d6efd;
  color:white;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccd5e3;
  border-radius:9px;
  font-size:15px;
  background:white;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.btn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:10px;
  background:#0d6efd;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.btn:hover{
  background:#084db4;
}

.btn.green{
  background:#198754;
}

.btn.gray{
  background:#6c757d;
}

.distance-box{
  margin-top:15px;
  background:#eef6ff;
  border-radius:12px;
  padding:15px;
  text-align:center;
}

.distance{
  font-size:28px;
  font-weight:bold;
  color:#075dcc;
}

.small{
  font-size:13px;
  color:#666;
}

.car-list{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.car{
  border:1px solid #dbe3ef;
  border-radius:12px;
  padding:15px;
  background:#fbfdff;
}

.car h3{
  margin:0 0 8px;
  color:#075dcc;
}

.car-info{
  line-height:1.7;
}

.car button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:8px;
  background:#198754;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.selected{
  border:2px solid #198754;
  background:#f0fff7;
}

.fare-box{
  background:#f8f9fa;
  border-radius:12px;
  padding:15px;
}

.fare-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #ddd;
}

.fare-row:last-child{
  border-bottom:none;
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#198754;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-top:12px;
  text-align:center;
  font-weight:bold;
}

.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.loading{
  text-align:center;
  padding:15px;
  color:#666;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }

  .trip-buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚕 Book My Car</h1>
  <p>अपनी सवारी अभी बुक करें</p>
