<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Book My Car</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7ff;
  color:#222
}

header{
  background:linear-gradient(135deg,#0066ff,#00a8ff);
  color:#fff;
  text-align:center;
  padding:22px 15px
}

header h1{margin:0;font-size:28px}
header p{margin:7px 0 0}

.container{
  width:94%;
  max-width:850px;
  margin:20px auto
}

.card{
  background:#fff;
  padding:20px;
  margin-bottom:18px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08)
}

h2{margin-top:0;font-size:21px}

label{
  display:block;
  font-weight:bold;
  margin:13px 0 6px
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ccd5e2;
  border-radius:9px;
  font-size:16px
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px
}

button{
  border:0;
  padding:12px 17px;
  border-radius:9px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold
}

.tripBtn{
  background:#e8eef7;
  color:#222
}

.tripBtn.active{
  background:#007bff;
  color:#fff
}

.primary{
  width:100%;
  margin-top:16px;
  background:#007bff;
  color:#fff;
  font-size:17px
}

.success{background:#0b9b55;color:#fff}

.distanceBox{
  text-align:center;
  background:#eef6ff;
  border-radius:12px;
  padding:18px;
  margin-top:15px
}

.distance{
  font-size:32px;
  font-weight:bold;
  color:#0066ff;
  margin:5px
}

.status{
  font-size:14px;
  color:#555
}

.car{
  border:2px solid #e1e7f0;
  border-radius:12px;
  padding:15px;
  margin:10px 0
}

.car.selected{
  border-color:#007bff;
  background:#eef6ff
}

.car h3{margin:0 0 8px}
.car p{margin:5px 0}

.selectCar{
  background:#007bff;
  color:#fff;
  width:100%;
  margin-top:8px
}

.fare{
  background:#f7f9fc;
  border-radius:12px;
  padding:15px
}

.fareRow{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #e5e8ed
}

.total{
  font-size:23px;
  color:#087d42
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-top:10px
}

.error{background:#ffe9e9;color:#a30000}
.ok{background:#e8fff2;color:#087d42}

.bookingBox{display:none}

.small{
  font-size:13px;
  color:#666
}

.loading{
  text-align:center;
  padding:15px
}

@media(max-width:600px){
  .row{grid-template-columns:1fr}
  header h1{font-size:24px}
}
</style>
</head>

<body>

<header>
<h1>🚕 Book My Car</h1>
<p>अपनी सवारी अभी बुक करें</p>
</header>

<div class="container">

<!-- TRIP -->
<div class="card">

<h2>
