<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book My Car</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:0;
}
header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:20px;
}
.container{
    max-width:500px;
    margin:25px auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px #bbb;
}
input,select,button{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
    border-radius:6px;
    border:1px solid #ccc;
}
button{
    background:#007bff;
    color:white;
    border:none;
    font-size:17px;
    cursor:pointer;
}
button:hover{
    background:#0056b3;
}
#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🚗 Book My Car</h1>
    <p>Car Booking Service</p>
</header>

<div class="container">

<h2>Booking करें</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="आपका नाम" required>

<input type="tel" id="phone" placeholder="मोबाइल नंबर" required>

<input type="text" id="car" placeholder="कार का नाम" required>

<input type="date" id="date" required>

<input type="time" id="time" required>

<button type="submit">🚗 Booking करें</button>

</form>

<div id="message"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA",
    authDomain: "book-my-car-a97cf.firebaseapp.com",
    projectId: "book-my-car-a97cf",
    storageBucket: "book-my-car-a97cf.firebasestorage.app",
    messagingSenderId: "546652899903",
    appId: "1:546652899903:web:c280a58db101e01d1d468a"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const bookingForm = document.getElementById("bookingForm");

bookingForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const message = document.getElementById("message");

    message.innerText = "Booking save हो रही है...";

    try {

        await addDoc(collection(db, "bookings"), {

            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            car: document.getElementById("car").value,
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            status: "pending",
            createdAt: serverTimestamp()

        });

        message.innerText = "✅ Booking सफलतापूर्वक भेज दी गई!";

        bookingForm.reset();

    } catch (error) {

        console.error(error);

        message.innerText =
        "❌ Booking save नहीं हुई। Firebase settings/check करें।";

    }

});

</script>

</body>
</html>
