<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book My Car - Owner Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#071b4d,#0b63f6);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top b{font-size:22px}.wrap{max-width:1100px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px #10204d12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border-radius:15px;background:#f7faff}.stat b{font-size:27px;color:#0b63f6}.hidden{display:none!important}.msg{padding:12px;border-radius:10px;margin:10px 0}.good{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}button{padding:12px 16px;border:0;border-radius:10px;background:#0b63f6;color:#fff;font-weight:800;cursor:pointer}.danger{background:#dc2626}.ok{background:#079455}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid #e5eaf1;text-align:left}.badge{padding:5px 9px;border-radius:99px;background:#eef5ff}.small{font-size:13px;color:#667085}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><b>🚗 Book My Car • Owner</b><button id="logout" class="danger hidden">Logout</button></header><main class="wrap"><section id="login" class="card"><h2>📱 Owner Login</h2><p class="small">Mobile OTP से secure login करें।</p><div id="loginMsg"></div><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile" style="padding:14px;width:100%;border:1px solid #d5ddea;border-radius:10px"><div id="recaptcha-container" style="margin:12px 0"></div><button id="sendOtp">OTP भेजें</button><div id="otpBox" class="hidden"><input id="otp" maxlength="6" inputmode="numeric" placeholder="6 digit OTP" style="padding:14px;width:100%;border:1px solid #d5ddea;border-radius:10px;margin:12px 0"><button id="verifyOtp" class="ok">OTP Verify करें</button></div></section><section id="panel" class="hidden"><div class="grid"><div class="stat">🚗 मेरी Cars<br><b id="cars">0</b></div><div class="stat">📋 Total Booking<br><b id="total">0</b></div><div class="stat">⏳ Pending<br><b id="pending">0</b></div><div class="stat">💰 Earnings<br><b id="earnings">₹0</b></div></div><div class="card"><h2>📋 Booking Requests</h2><div id="msg"></div><div class="table"><table><thead><tr><th>Customer</th><th>Route</th><th>Date/Time</th><th>Fare</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingBody"></tbody></table></div></div><div class="card"><h2>🚘 मेरी Cars</h2><p class="small">नई car जोड़ने या details बदलने के लिए Owner Car Management खोलें।</p><a href="AddCar.html"><button>➕ Car Management</button></a><div id="carBody" style="margin-top:12px"></div></div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,getDocs,query,where,doc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';const cfg={apiKey:'AIzaSyDD-jSNG_HfhW4aTXtdf0kpdclaDVbgrNA',authDomain:'book-my-car-a97cf.firebaseapp.com',projectId:'book-my-car-a97cf',storageBucket:'book-my-car-a97cf.firebasestorage.app',messagingSenderId:'546652899903',appId:'1:546652899903:web:c280a58db101e01d1d468a'},auth=getAuth(initializeApp(cfg)),db=getFirestore(initializeApp(cfg)),$=id=>document.getElementById(id);let confirmationResult=null,recaptcha=null,bookings=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>'₹'+Math.round(Number(v)||0).toLocaleString('en-IN');function lm(t,g=false){$('loginMsg').innerHTML='<div class="msg '+(g?'good':'err')+'">'+esc(t)+'</div>'}function m(t,g=false){$('msg').innerHTML='<div class="msg '+(g?'good':'err')+'">'+esc(t)+'</div>'}function setup(){if(recaptcha)return;recaptcha=new RecaptchaVerifier(auth,'recaptcha-container',{size:'normal'});recaptcha.render()}function phone(){const p=$('phone').value.replace(/\D/g,'');return p.length===10?'+91'+p:null}$('sendOtp').onclick=async()=>{const p=phone();if(!p)return lm('10 digit mobile number डालें।');try{setup();confirmationResult=await signInWithPhoneNumber(auth,p,recaptcha);$('otpBox').classList.remove('hidden');lm('OTP भेज दिया गया।','good')}catch(e){lm('OTP नहीं भेजा गया: '+(e.code||e.message))}};$('verifyOtp').onclick=async()=>{try{if(!confirmationResult)return lm('पहले OTP भेजें।');const c=$('otp').value.trim();if(!/^\d{6}$/.test(c))return lm('6 digit OTP डालें।');const r=await confirmationResult.confirm(c);await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(x=>x.setDoc(x.doc(db,'owners',r.user.uid),{uid:r.user.uid,phone:r.user.phoneNumber||phone(),updatedAt:serverTimestamp()},{merge:true}));lm('Login सफल।','good')}catch(e){lm('OTP verification failed: '+(e.code||e.message))}};$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden');$('logout').classList.add('hidden')}});async function load(){try{const cs=await getDocs(query(collection(db,'cars'),where('ownerUid','==',auth.currentUser.uid)));$('cars').textContent=cs.size;$('carBody').innerHTML=cs.docs.map(d=>{const c=d.data();return '<div class="card" style="margin:10px 0;padding:14px"><b>🚗 '+esc(c.carName)+'</b><br>Rate/KM: '+money(c.ratePerKm)+'<br>Status: '+esc(c.status||'available')+'</div>'}).join('')||'<p class="small">कोई car नहीं।</p>';const bs=await getDocs(query(collection(db,'bookings'),where('ownerUid','==',auth.currentUser.uid)));bookings=bs.docs.map(d=>({id:d.id,...d.data()}));$('total').textContent=bookings.length;$('pending').textContent=bookings.filter(b=>String(b.status||'').toLowerCase()==='pending').length;$('earnings').textContent=money(bookings.filter(b=>String(b.status||'').toLowerCase()==='confirmed').reduce((s,b)=>s+(Number(b.ownerEarning)||Number(b.totalFare)||0),0));$('bookingBody').innerHTML=bookings.map(b=>{const st=String(b.status||'Pending');return '<tr><td>'+esc(b.customerName||'-')+'<br>📱 '+esc(b.mobile||'-')+'</td><td>'+esc(b.pickup||'-')+' → '+esc(b.destination||'-')+'</td><td>'+esc(b.date||'-')+'<br>'+esc(b.pickupTime||'-')+'</td><td>'+money(b.totalFare)+'</td><td>'+esc(b.paymentMethod||'-')+'<br><span class="badge">'+esc(b.paymentStatus||'Pending')+'</span></td><td>'+esc(st)+'</td><td>'+(st.toLowerCase()==='pending'?'<button class="ok" data-a="confirm" data-id="'+b.id+'">Accept</button> <button class="danger" data-a="cancel" data-id="'+b.id+'">Reject</button>':'')+'</td></tr>'}).join('')||'<tr><td colspan="7">अभी कोई booking request नहीं।</td></tr>'}catch(e){m('Dashboard load नहीं हुआ: '+e.message)}}$('bookingBody').onclick=async e=>{const b=e.target.closest('button');if(!b)return;try{await updateDoc(doc(db,'bookings',b.dataset.id),{status:b.dataset.a==='confirm'?'Confirmed':'Cancelled',ownerActionAt:serverTimestamp()});m(b.dataset.a==='confirm'?'Booking accept हो गई।':'Booking reject हो गई।','good');load()}catch(x){m(x.message)}};setup();</script></body></html>
